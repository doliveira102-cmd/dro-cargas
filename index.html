0% - 72px)}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:4px 0 24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(15,36,67,.06);cursor:pointer}.card b{font-size:34px;display:block;margin-top:8px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 10px 28px rgba(15,36,67,.06)}.panel h2{margin:0 0 12px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.search{max-width:330px;width:100%;padding:13px;border:1px solid var(--line);border-radius:11px}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table th{background:#f8fbff;text-align:left;color:#30435f;font-size:13px;text-transform:uppercase}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#f8fbff}.route{font-weight:900}.money{display:inline-block;background:#eef4ff;padding:7px 10px;border-radius:10px;font-weight:900;margin:2px}.margin{background:#fff3e6}.status{display:inline-block;padding:7px 11px;border-radius:999px;font-weight:900;font-size:13px}.Disponivel{background:#dbeafe;color:#1d4ed8}.Agendado{background:#fef3c7;color:#92400e}.Manifestado{background:#ede9fe;color:#5b21b6}.Carregado{background:#dcfce7;color:#166534}.Transito{background:#ffedd5;color:#9a3412}.Finalizado{background:#dcfce7;color:#166534}.actionsRow{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:22px}.modal.show{display:flex}.box{background:white;border-radius:18px;padding:22px;max-width:900px;width:100%;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;color:#53637a;font-weight:800;margin:0 0 4px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white}.field textarea{min-height:80px}.span2{grid-column:1/-1}.readonly{background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:13px}.readonly small{display:block;color:#60708a}.readonly b{display:block;margin-top:3px}.steps{display:flex;gap:10px;flex-wrap:wrap}.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fbff}.step input{margin-right:7px}.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fdba74;color:#9a3412}.drop{border:2px dashed #9bb5d6;border-radius:14px;padding:18px;text-align:center;background:#f8fbff;min-height:160px}.drop img{max-width:100%;max-height:170px}.ad{white-space:pre-wrap;background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.hidden{display:none}.tableWrap{width:100%;overflow-x:auto}.manifest-table{min-width:1120px}.manifest-table th,.manifest-table td{white-space:nowrap;padding:10px 8px}.manifest-table .step{display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;min-width:124px;padding:8px 10px;margin:0}.manifest-table .step input{margin:0}.manifest-table .search{max-width:none;width:100%;min-width:105px;padding:8px}.manifest-save{min-width:78px}.login-note{font-size:12px;color:#60708a}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.side{width:72px}.side .brand span,.side .label{display:none}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.top{flex-direction:column}.table{font-size:13px}.table th,.table td{padding:9px}.actionsRow button{padding:7px 9px}.cards{grid-template-columns:1fr}}

<div id="login" class="modal" style="display:none"><div class="box" style="max-width:420px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:18px"><div class="logo">DRO</div><div><h1 style="font-size:28px">DRO Cargas</h1><div class="sub" style="margin:0">Gestão inteligente de fretes</div></div></div><div class="field"><label>E-mail</label><input id="email" value="diego@drocargas.com"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="senha" type="password" value="123456"></div><button class="green" style="width:100%;margin-top:16px" onclick="login()">Entrar</button><p class="sub">Login inicial: diego@drocargas.com / 123456</p></div></div>
<div class="app"><aside id="side" class="side closed"><div class="brand"><div class="logo">DRO</div><span>DRO Cargas<br><small>v6.1 Universal</small></span><button class="toggle" onclick="toggleSide()">▶</button></div><nav class="nav" id="nav"></nav></aside><main class="main" id="main"></main></div>

<script>
const KEY='DRO_CARGAS_DATA'; const MASTER='DRO_CARGAS_MASTER'; const OLD=['DRO_CARGAS_MASTER','DRO_CARGAS_DATA','droCargasData','DRO_CARGAS_V19','DRO_CARGAS_V20','dro-cargas'];
const firebaseConfig={
  apiKey:"AIzaSyDEZ0OuW2uznRTAcVxB_LfVOxR8J2Dc_VU",
  authDomain:"dro-cargas.firebaseapp.com",
  projectId:"dro-cargas",
  storageBucket:"dro-cargas.firebasestorage.app",
  messagingSenderId:"252244507021",
  appId:"1:252244507021:web:d0c96527fbc0dabc58e5c4"
};
let firebaseDb=null, cloudDoc=null, cloudReady=false, cloudApplying=false, cloudTimer=null, lastCloudPayload='', currentCloudStatus='☁️ Conectando à nuvem...';
let page='dashboard', search='', editId=null; let simpleFilters={clientes:'',motoristas:'',veiculos:''}; let manFilter={motorista:'',placa:'',agendado:'',manifestado:'',carregado:'',transito:'',finalizado:''};
let db=load();
const pages=[['dashboard','🏠','Dashboard'],['rascunhos','📝','Rascunhos'],['agenda','🗓️','Agenda'],['cargas','🚛','Cargas'],['importar','📥','Importação Inteligente'],['agendamentos','📋','Agendamentos'],['manifestos','📄','Manifestos'],['clientes','👥','Clientes'],['motoristas','👤','Motoristas'],['veiculos','🚚','Veículos'],['anuncios','📣','Anúncios'],['relatorios','📊','Relatórios']];
function defaultDb(){return{cargas:[],agendamentos:[],manifestos:[],clientes:[],motoristas:[],veiculos:[],anuncios:[],agenda:[],historico:[],rascunho:'',lastOp:0,version:'4.0'}}
function load(){let d=null; for(const k of OLD){let o=localStorage.getItem(k); if(o){d=o; break}} try{let x=d?JSON.parse(d):defaultDb(); return Object.assign(defaultDb(),x)}catch(e){return defaultDb()}}
function localOnlySave(){const payload=JSON.stringify(db); localStorage.setItem(KEY,payload); localStorage.setItem(MASTER,payload); try{localStorage.setItem('DRO_CARGAS_V35_ULTIMO',payload)}catch(e){} return payload}
function save(){const payload=localOnlySave(); if(!cloudApplying) queueCloudSave(payload)}
function queueCloudSave(payload){
  if(!cloudReady||!cloudDoc)return;
  if(payload===lastCloudPayload)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>saveCloud(payload),450);
}
async function saveCloud(payload){
  if(!cloudDoc)return;
  try{
    const payloadObj=JSON.parse(payload);
    lastCloudPayload=payload;
    await cloudDoc.set({db:payloadObj,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),version:'4.2-firebase'}, {merge:true});
    await mirrorCollections(payloadObj);
    showCloudStatus('☁️ Salvo na nuvem');
  }catch(e){
    console.error('Erro ao salvar no Firebase:',e);
    showCloudStatus('⚠️ Erro ao salvar na nuvem: '+(e && e.message ? e.message : e));
  }
}
function showCloudStatus(txt){
  currentCloudStatus=txt;
  let el=document.getElementById('cloudStatus');
  if(!el)return;
  el.textContent=txt;
}
function normalizeForCloud(obj){
  try{return JSON.parse(JSON.stringify(obj||{}))}catch(e){return {}}
}
function itemId(item, prefix){
  if(item && item.id)return String(item.id);
  return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}
async function mirrorCollections(payloadObj){
  if(!firebaseDb)return;
  const map={cargas:'cargas',clientes:'clientes',motoristas:'motoristas',veiculos:'veiculos',agenda:'agenda',agendamentos:'agendamentos',manifestos:'manifestos',anuncios:'anuncios'};
  let batch=firebaseDb.batch();
  let ops=0;
  for(const [key,col] of Object.entries(map)){
    const arr=Array.isArray(payloadObj[key])?payloadObj[key]:[];
    for(const raw of arr){
      const item=normalizeForCloud(raw);
      const id=itemId(item,key);
      item.id=id;
      item._updatedAt=new Date().toISOString();
      batch.set(firebaseDb.collection(col).doc(id), item, {merge:true});
      ops++;
      if(ops>=450){ await batch.commit(); batch=firebaseDb.batch(); ops=0; }
    }
  }
  if(ops>0)await batch.commit();
}
function initFirebaseCloud(){
  try{
    if(!window.firebase){console.warn('Firebase SDK não carregou.'); showCloudStatus('⚠️ Firebase SDK não carregou'); return;}
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    firebaseDb=firebase.firestore();
    cloudDoc=firebaseDb.collection('droCargas').doc('principal');
    showCloudStatus('☁️ Conectando à nuvem...');
    cloudDoc.onSnapshot((snap)=>{
      cloudReady=true;
      if(!snap.exists){
        saveCloud(localOnlySave());
        showCloudStatus('☁️ Criando banco na nuvem...');
        return;
      }
      const remote=snap.data()?.db;
      if(!remote){
        saveCloud(localOnlySave());
        return;
      }
      const remotePayload=JSON.stringify(remote);
      const localPayload=localOnlySave();
      if(remotePayload!==localPayload){
        cloudApplying=true;
        db=Object.assign(defaultDb(),remote);
        normalize();
        localOnlySave();
        lastCloudPayload=JSON.stringify(db);
        render();
        cloudApplying=false;
      }
      showCloudStatus('☁️ Sincronizado');
    },(err)=>{
      console.error('Erro ao sincronizar Firebase:',err);
      showCloudStatus('⚠️ Sem conexão com nuvem: '+(err && err.message ? err.message : err));
    });
  }catch(e){
    console.error('Erro ao iniciar Firebase:',e);
    showCloudStatus('⚠️ Firebase não iniciado: '+(e && e.message ? e.message : e));
  }
}
function login(){const e=document.getElementById('email').value.trim(); const s=document.getElementById('senha').value.trim(); if(e!=='diego@drocargas.com'||s!=='123456'){alert('E-mail ou senha incorretos.'); return;} sessionStorage.setItem('DRO_CARGAS_SESSAO','1');document.getElementById('login').classList.remove('show');document.getElementById('login').style.display='none'; page='dashboard'; render(); initFirebaseCloud()}
function logout(){sessionStorage.removeItem('DRO_CARGAS_SESSAO'); document.getElementById('login').style.display='flex'; document.getElementById('login').classList.add('show');}
function toggleSide(){let s=document.getElementById('side'); s.classList.toggle('closed'); s.querySelector('.toggle').textContent=s.classList.contains('closed')?'▶':'◀'}
function go(p){page=p; search=''; render()}
function renderNav(){document.getElementById('nav').innerHTML=pages.map(p=>`<a title="${p[2]}" class="${page==p[0]?'active':''}" onclick="go('${p[0]}')"><span class="ico">${p[1]}</span><span class="label">${p[2]}</span></a>`).join('')}
function render(){normalize(); save(); renderNav(); const m=document.getElementById('main'); const title=pages.find(x=>x[0]==page)?.[2]||''; if(page==='dashboard') return dashboard(m); if(page==='rascunhos') return rascunhosPage(m); if(page==='cargas') return cargasPage(m); if(page==='agendamentos') return agPage(m); if(page==='manifestos') return manPage(m); if(page==='anuncios') return adsPage(m); if(page==='pendencias') return pendPage(m); if(page==='importar') return importPage(m); if(page==='clientes') return simplePage(m,'clientes','Clientes',['nome','cidade','uf','contato','cnpj','localizacao','telefone','email','observacoes']); if(page==='motoristas') return simplePage(m,'motoristas','Motoristas',['nome','telefone','placa','cidade','tipoVeiculo','observacoes']); if(page==='veiculos') return simplePage(m,'veiculos','Veículos',['placa','tipo','motorista','cidade','situacao']); if(page==='agenda') return simplePage(m,'agenda','Agenda',['titulo','descricao','data']); if(page==='relatorios') return reports(m);}
function topHtml(title,sub='Resumo operacional do DRO Cargas'){return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div><div id="cloudStatus" class="sub" style="margin-top:6px;font-weight:800">${currentCloudStatus}</div></div><div class="actions"><button class="btn" onclick="backup()">Backup JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restaurar Backup</button><button class="primary" onclick="openCarga()">+ Nova Carga</button><button class="ghost" onclick="go('importar')">📥 Importação Inteligente</button><button class="dark" onclick="logout()">Sair</button></div></div>`}
function statusClass(s){return String(s||'Disponível').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('Em transito','Transito')}
function dateBR(d){if(!d)return''; if(d.includes('/'))return d; let [y,m,da]=d.split('-'); return y&&m&&da?`${da}/${m}/${y}`:d}
function today(){return new Date().toISOString().slice(0,10)}
function currency(v){let n=Number(String(v||0).replace(',','.'))||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function nextOp(){let max=Math.max(0,...db.cargas.map(c=>parseInt(c.op)||0),db.lastOp||0); db.lastOp=max+1; return String(db.lastOp).padStart(3,'0')}
function sortedCargas(){return [...db.cargas].sort((a,b)=>(parseInt(b.op)||0)-(parseInt(a.op)||0))}
function normalize(){
  db.cargas.forEach(c=>{
    if(!c.op)c.op=nextOp();
    if(!c.id)c.id=crypto.randomUUID();
    if(!c.data)c.data=today();
    if(c.status==='ativo')c.status='Disponível';
    if(!c.status)c.status='Disponível';
    c.valorEmpresa=Number(c.valorEmpresa ?? c.valor ?? 0);
    c.margem=Number(c.margem ?? 10);
    c.valorMotorista=Number(c.valorMotorista ?? c.valorEmpresa*(1-c.margem/100));
  });
  db.agendamentos.forEach(a=>{if(!a.id)a.id=crypto.randomUUID();});
  db.manifestos.forEach(m=>{
    if(!m.id)m.id=crypto.randomUUID();
    m.agendado=true;
    m.manifestado=!!m.manifestado;
    m.carregado=!!m.carregado;
    m.transito=!!m.transito;
    m.finalizado=!!m.finalizado;
    if(m.finalizado){m.manifestado=true; m.carregado=true; m.transito=true;}
    else if(m.transito){m.manifestado=true; m.carregado=true;}
    else if(m.carregado){m.manifestado=true;}
    let c=db.cargas.find(x=>x.id===m.cargaId);
    // Regra principal: o Manifesto é a fonte da verdade do fluxo operacional.
    // Nunca apagar marcações feitas pelo usuário ao trocar de tela.
    if(c){
      if(m.finalizado)c.status='Finalizado';
      else if(m.transito)c.status='Em trânsito';
      else if(m.carregado)c.status='Carregado';
      else if(m.manifestado)c.status='Manifestado';
      else if(m.agendado)c.status='Agendado';
    }
  });
}
function counts(){let c=db.cargas; return{disp:c.filter(x=>x.status==='Disponível').length,agen:c.filter(x=>x.status==='Agendado').length,mani:c.filter(x=>x.status==='Manifestado').length,fin:c.filter(x=>x.status==='Finalizado').length,pend:pendencias().length}}
function dashboard(m){let ct=counts(); m.innerHTML=topHtml('Dashboard')+`<div class="cards"><div class="card" onclick="search='Disponível';go('cargas')">Disponíveis<b>${ct.disp}</b></div><div class="card" onclick="search='Agendado';go('cargas')">Agendadas<b>${ct.agen}</b></div><div class="card" onclick="search='Manifestado';go('cargas')">Manifestadas<b>${ct.mani}</b></div><div class="card" onclick="search='Finalizado';go('cargas')">Finalizadas<b>${ct.fin}</b></div><div class="card" onclick="go('manifestos')">Pendências<b>${ct.pend}</b></div></div>`+cargasTable(sortedCargas().slice(0,10),'Últimas cargas')}
function cargasPage(m){m.innerHTML=topHtml('Cargas','Cadastro e controle de cargas')+cargasTable(filteredCargas(),'Cargas')}
function filteredCargas(){let q=search.toLowerCase(); return sortedCargas().filter(c=>!q||JSON.stringify(c).toLowerCase().includes(q))}
function cargasTable(rows,title){return `<div class="panel"><div class="toolbar"><h2>${title}</h2><input class="search" placeholder="Buscar..." oninput="search=this.value;render()" value="${search}"></div><table class="table"><thead><tr><th>OP</th><th>Cliente</th><th>Rota</th><th>Produto</th><th>Valores</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.length?rows.map(c=>`<tr onclick="detailsCarga('${c.id}')"><td>${c.op}</td><td>${c.cliente||''}</td><td class="route">${c.origem||''} → ${c.destino||''}</td><td>${c.produto||''}<br><small>${c.quantidade||''}</small></td><td><span class="money">Emp: ${currency(c.valorEmpresa)}</span><span class="money margin">${c.margem}%</span><span class="money">Mot: ${currency(c.valorMotorista)}</span></td><td>${dateBR(c.data)}</td><td><span class="status ${statusClass(c.status)}">${c.status}</span></td><td onclick="event.stopPropagation()"><div class="actionsRow"><button class="green small" onclick="openAg('${c.id}')">Agendar</button><button class="btn small" onclick="openCarga('${c.id}')">Editar</button><button class="btn small" onclick="dupCarga('${c.id}')">Duplicar</button><button class="red small" onclick="delCarga('${c.id}')">Excluir</button></div></td></tr>`).join(''):`<tr><td colspan="8" style="text-align:center;color:#60708a">Nenhuma carga cadastrada</td></tr>`}</tbody></table></div>`}
function openModal(html){document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function saveManifesto(id){
  let f=db.manifestos.find(x=>x.id===id); if(!f)return;
  const get=k=>!!document.getElementById(`mf_${id}_${k}`)?.checked;
  let novo={manifestado:get('manifestado'),carregado:get('carregado'),transito:get('transito'),finalizado:get('finalizado')};
  if(novo.finalizado && !novo.transito){alert('Para finalizar, marque primeiro Em trânsito.'); return;}
  if(novo.transito && !novo.carregado){alert('Para marcar Em trânsito, marque primeiro Carregado.'); return;}
  if(novo.carregado && !novo.manifestado){alert('Para marcar Carregado, marque primeiro Manifestado.'); return;}
  if(!novo.manifestado){novo.carregado=false; novo.transito=false; novo.finalizado=false;}
  if(!novo.carregado){novo.transito=false; novo.finalizado=false;}
  if(!novo.transito){novo.finalizado=false;}
  f.agendado=true; f.manifestado=novo.manifestado; f.carregado=novo.carregado; f.transito=novo.transito; f.finalizado=novo.finalizado;
  let c=db.cargas.find(x=>x.id===f.cargaId);
  if(c){
    if(f.finalizado)c.status='Finalizado';
    else if(f.transito)c.status='Em trânsito';
    else if(f.carregado)c.status='Carregado';
    else if(f.manifestado)c.status='Manifestado';
    else c.status='Agendado';
    addHist(c.id,'Manifesto salvo: '+c.status);
  }
  normalize(); save(); alert('Manifesto salvo.'); render();
}


function pendencias(){let p=[]; db.cargas.forEach(c=>{let f=db.manifestos.find(x=>x.cargaId===c.id);
  // Carga disponível não é pendência; é oportunidade de frete.
  if(c.status==='Agendado'&&(!f||!f.manifestado))p.push({c,t:'Aguardando manifesto'});
  if(c.status==='Manifestado'&&(!f||!f.carregado))p.push({c,t:'Aguardando carregamento'});
  if(c.status==='Carregado'&&(!f||!f.transito))p.push({c,t:'Aguardando saída/em trânsito'});
  if(c.status==='Em trânsito'&&(!f||!f.finalizado))p.push({c,t:'Aguardando finalização'});
}); return p}

let imp={};
function setImportStatus(txt){let el=document.getElementById('importStatus'); if(el)el.textContent=txt;}
async function smartPaste(e){
  const items=[...(e.clipboardData?.items||[])];
  const img=items.find(i=>i.type.startsWith('image/'));
  if(img){e.preventDefault(); await processSmartFile(img.getAsFile()); return;}
  const text=e.clipboardData?.getData('text/plain');
  if(text){setTimeout(()=>{previewImport();},80); return;}
}
async function smartDrop(e){
  e.preventDefault();
  let z=document.getElementById('smartDrop'); if(z)z.style.background='#f8fbff';
  if(e.dataTransfer.files&&e.dataTransfer.files.length){await processSmartFile(e.dataTransfer.files[0]); return;}
  const text=e.dataTransfer.getData('text/plain');
  if(text){document.getElementById('impText').value=text; previewImport();}
}
async function smartFile(e){if(e.target.files&&e.target.files[0])await processSmartFile(e.target.files[0]); e.target.value='';}
async function processSmartFile(file){
  setImportStatus('Analisando '+(file.name||'arquivo')+'...');
  const type=file.type||'';
  if(type.startsWith('image/')){await readImageSmart(file); return;}
  if(type==='application/pdf'||/\.pdf$/i.test(file.name||'')){await readPdfSmart(file); return;}
  await readTextSmart(file);
}
async function readTextSmart(file){
  const txt=await file.text();
  document.getElementById('impText').value=txt;
  setImportStatus('Texto identificado automaticamente.');
  previewImport();
}
async function readImageSmart(file){
  const dataUrl=await new Promise(res=>{let r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file)});
  const z=document.getElementById('smartDrop');
  if(z)z.innerHTML=`<img src="${dataUrl}" style="max-height:180px"><b>Imagem recebida. Fazendo leitura automática...</b>`;
  try{
    if(!window.Tesseract)throw new Error('OCR indisponível');
    const ret=await Tesseract.recognize(file,'por+eng',{logger:m=>{if(m.status)setImportStatus('OCR: '+m.status+(m.progress?` ${Math.round(m.progress*100)}%`:''));}});
    const txt=(ret.data&&ret.data.text)||'';
    document.getElementById('impText').value=txt;
    setImportStatus(txt.trim()?'Imagem lida automaticamente.':'Imagem recebida, mas pouco texto foi encontrado.');
    previewImport();
  }catch(err){
    console.error(err);
    setImportStatus('Imagem recebida. OCR não conseguiu ler; cole o texto se tiver.');
  }
}
async function readPdfSmart(file){
  try{
    if(!window.pdfjsLib)throw new Error('PDF.js indisponível');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let out=[];
    for(let i=1;i<=pdf.numPages;i++){
      setImportStatus(`Lendo PDF página ${i}/${pdf.numPages}...`);
      const page=await pdf.getPage(i);
      const txt=await page.getTextContent();
      out.push(txt.items.map(x=>x.str).join(' '));
    }
    document.getElementById('impText').value=out.join('\n');
    setImportStatus('PDF lido automaticamente.');
    previewImport();
  }catch(err){
    console.error(err);
    setImportStatus('Não consegui ler este PDF automaticamente.');
  }
}
function clearSmartImport(){imp={}; let t=document.getElementById('impText'); if(t)t.value=''; let p=document.getElementById('prev'); if(p)p.innerHTML='<div class="readonly span2">Cole texto, imagem ou PDF para o DRO analisar automaticamente.</div>'; setImportStatus('Aguardando conteúdo...');}
function cleanLine(x){return String(x||'').replace(/\s+/g,' ').trim();}
function numBR(v){let s=String(v||'').replace(/[^0-9,\.]/g,''); if(!s)return 0; if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(','))s=s.replace(',','.'); return Number(s)||0;}
let impList=[];
const DRO_PRODUCTS=['SOJA A GRANEL','SOJA BENEFICIADA','SOJA','MILHO','TRIGO','FARELO DE SOJA','FARELO','ARROZ','DDG','FERTILIZANTE','ADUBO','CALCÁRIO','CALCARIO'];
const DRO_VEHICLES=['9 EIXOS','7 EIXOS','6 EIXOS','BITREM','RODOTREM','LS','GRANELEIRO','BASCULANTE','CARRETA','TRUCK','4 EIXO','4 EIXOS'];
const DRO_DESTINOS=['RIO GRANDE','PORTO RIO GRANDE','PORTO DE RIO GRANDE','CANOAS','CAPÃO DO LEÃO','CAPAO DO LEAO','PARANAGUÁ','PARANAGUA','ESTRELA','PASSO FUNDO','PORTO ALEGRE'];
function onlyClean(s){
  return String(s||'')
    .replace(/[🚨🌱📍🏁💰🚛🟢🔴🟡⚠️✅❌]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function upperClean(s){return onlyClean(s).toUpperCase();}
function pickProduct(txt){
  const u=upperClean(txt);
  for(const p of DRO_PRODUCTS){ if(u.includes(p)) return p; }
  return '';
}
function pickVehicle(txt){
  const u=upperClean(txt);
  for(const v of DRO_VEHICLES){ if(new RegExp('\\b'+v.replace(/\s+/g,'\\s*')+'\\b','i').test(u)) return v; }
  let m=u.match(/\b(\d)\s*EIXOS?\b/); return m?m[1]+' EIXOS':'';
}
function pickMoney(txt){
  const s=String(txt||'');
  let m=s.match(/R\$\s*([0-9]{1,4}(?:[\.,][0-9]{1,2})?)/i);
  if(m)return numBR(m[1]);
  let m2=s.match(/\bFRETE\s*[:=-]?\s*([0-9]{2,4}(?:[\.,][0-9]{1,2})?)/i);
  if(m2)return numBR(m2[1]);
  return 0;
}
function pickQuantity(txt){
  const u=upperClean(txt);
  let m=u.match(/\b([0-9]{1,4}(?:[\.,][0-9])?)\s*(TONS?|TN|T)\b/);
  return m?m[1].replace('.',',')+' TONS':'';
}
function fixPlace(s){
  s=upperClean(s)
    .replace(/^ORIGEM[:\s-]*/,'')
    .replace(/^DESTINO[:\s-]*/,'')
    .replace(/^DE[:\s-]*/,'')
    .replace(/^PARA[:\s-]*/,'')
    .replace(/\s+-\s*RS$/,' - RS')
    .replace(/\bPORTO RIO GRANDE\b/g,'RIO GRANDE')
    .trim();
  return s;
}
function getLineAfterIcon(rawLines, iconRegex){
  for(let i=0;i<rawLines.length;i++){
    if(iconRegex.test(rawLines[i])){
      const same=onlyClean(rawLines[i].replace(iconRegex,''));
      if(same && !/^(ORIGEM|DESTINO|CARREGAMENTO|CARGA)$/i.test(same)) return same;
      for(let j=i+1;j<Math.min(i+3, rawLines.length);j++){
        const v=onlyClean(rawLines[j]);
        if(v && !/^(ORIGEM|DESTINO|CARREGAMENTO|CARGA)$/i.test(v)) return v;
      }
    }
  }
  return '';
}
function parseWhatsAppTxt(t){
  const rawLines=String(t||'').replace(/\r/g,'\n').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const lines=rawLines.map(onlyClean).filter(Boolean);
  const joined=lines.join('\n');
  const u=upperClean(joined);
  let produto=pickProduct(joined);
  let tipoVeiculo=pickVehicle(joined);
  let quantidade=pickQuantity(joined);
  let valorEmpresa=pickMoney(joined);
  let margem=Number(document.getElementById('impMarg')?.value||10);
  let valorMotorista=valorEmpresa?valorEmpresa*(1-margem/100):0;
  let origem='', destino='';
  origem=getLineAfterIcon(rawLines,/📍|ORIGEM/i);
  destino=getLineAfterIcon(rawLines,/🏁|DESTINO/i);
  if(!origem||!destino){
    const locs=lines.filter(l=>/-\s*[A-Z]{2}\b/i.test(l) && !/R\$|FRETE|EIXOS|SOJA|MILHO|TRIGO|FARELO|CARREGAMENTO/i.test(l));
    if(locs.length>=2){ origem=origem||locs[0]; destino=destino||locs[1]; }
  }
  if(!origem||!destino){
    let rota=lines.find(l=>/\s+(?:X|x)\s+|→|->/.test(l));
    if(rota){
      let parts=rota.split(/\s+(?:X|x)\s+|\s*→\s*|\s*->\s*/);
      if(parts.length>=2){origem=origem||parts[0]; destino=destino||parts.slice(1).join(' ');}
    }
  }
  let cliente='';
  if(db.clientes&&db.clientes.length){
    const known=db.clientes.find(c=>c.nome&&u.includes(String(c.nome).toUpperCase()));
    if(known)cliente=known.nome;
  }
  return {cliente,origem:fixPlace(origem),destino:fixPlace(destino),produto,quantidade,valorEmpresa,margem,valorMotorista,data:today(),tipoVeiculo,status:'Disponível',obs:''};
}
function splitTableColumns(line){
  return String(line||'').replace(/\t/g,'  ').split(/\s{2,}/).map(onlyClean).filter(Boolean);
}
function parseTableRows(t){
  const raw=String(t||'').replace(/\r/g,'\n');
  const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const rows=[];
  for(const line of lines){
    const u=upperClean(line);
    if(!/\d{2}\/\d{2}\/\d{4}/.test(line)) continue;
    if(!pickProduct(line)) continue;
    let cols=splitTableColumns(line);
    let date=(line.match(/\d{2}\/\d{2}\/\d{4}/)||[])[0]||today();
    let produto=pickProduct(line);
    let valorEmpresa=0;
    const afterProd=u.split(produto)[1]||'';
    const frete=(afterProd.match(/\b([0-9]{2,4})(?:\s|$)/)||[])[1];
    if(frete)valorEmpresa=numBR(frete);
    if(!valorEmpresa)valorEmpresa=pickMoney(line);
    let margem=Number(document.getElementById('impMarg')?.value||10);
    let valorMotorista=valorEmpresa?valorEmpresa*(1-margem/100):0;
    let cliente='', origem='', destino='';
    if(cols.length>=8){
      // Normalmente: Data | Modal | CN | Cliente | Tomador | Origem | Destino | Produto | Frete | Turno
      const pidx=cols.findIndex(c=>upperClean(c).includes(produto));
      if(pidx>=0){
        destino=cols[pidx-1]||'';
        origem=cols[pidx-2]||'';
        cliente=cols[pidx-4]||cols[pidx-3]||'';
      }
    }
    if(!destino){
      const knownDest=DRO_DESTINOS.find(d=>u.includes(d));
      if(knownDest)destino=knownDest;
    }
    if(!origem && destino){
      const before=u.split(upperClean(destino))[0];
      const pieces=before.split(/\s{2,}|\|/).map(onlyClean).filter(Boolean);
      origem=pieces[pieces.length-1]||'';
    }
    if(!cliente && db.clientes&&db.clientes.length){
      const known=db.clientes.find(c=>c.nome&&u.includes(String(c.nome).toUpperCase()));
      if(known)cliente=known.nome;
    }
    if(!cliente && cols.length>=4)cliente=cols[3];
    rows.push({cliente:fixPlace(cliente),origem:fixPlace(origem),destino:fixPlace(destino),produto,quantidade:'',valorEmpresa,margem,valorMotorista,data:date.split('/').reverse().join('-'),tipoVeiculo:pickVehicle(line),status:'Disponível',obs:''});
  }
  return rows.filter(r=>r.produto || r.origem || r.destino || r.valorEmpresa);
}
function parseTxt(t){
  // Mantém compatibilidade: retorna a primeira carga identificada.
  const list=parseMultiTxt(t);
  return list[0]||{cliente:'',origem:'',destino:'',produto:'',quantidade:'',valorEmpresa:0,margem:Number(document.getElementById('impMarg')?.value||10),valorMotorista:0,data:today(),tipoVeiculo:'',status:'Disponível',obs:''};
}
function parseMultiTxt(t){
  const txt=String(t||'');
  let rows=parseTableRows(txt);
  if(rows.length>1)return rows;
  const w=parseWhatsAppTxt(txt);
  if(w.origem||w.destino||w.produto||w.valorEmpresa)return [w];
  if(rows.length===1)return rows;
  // Fallback antigo para texto solto
  let raw=String(t||'').replace(/\r/g,'\n');
  let lines=raw.split(/\n+/).map(cleanLine).filter(Boolean);
  let all=lines.join('\n');
  let flat=all.replace(/\n/g,' | ');
  const findAfter=(labels)=>{for(const lab of labels){let r=new RegExp(lab+'\\s*[:=-]\\s*([^|\\n]+)','i'); let m=flat.match(r); if(m)return cleanLine(m[1]);} return '';};
  let origem=findAfter(['origem','coleta','carregamento','embarque']);
  let destino=findAfter(['destino','entrega','descarga']);
  if(!origem||!destino){
    let rota=lines.find(l=>/\s+(x|X)\s+|→|->|-/i.test(l)&&!/(r\$|frete|valor|empresa|motorista)/i.test(l))||'';
    let parts=rota.split(/\s+(?:x|X)\s+|\s*→\s*|\s*->\s*/);
    if(parts.length>=2){origem=origem||cleanLine(parts[0]); destino=destino||cleanLine(parts.slice(1).join(' '));}
  }
  let produto=pickProduct(all);
  let quantidade=pickQuantity(all);
  let tipoVeiculo=pickVehicle(all);
  let cliente=findAfter(['cliente','empresa','embarcador']);
  if(!cliente&&db.clientes&&db.clientes.length){let known=db.clientes.find(c=>c.nome&&all.toLowerCase().includes(String(c.nome).toLowerCase())); if(known)cliente=known.nome;}
  let valorEmpresa=pickMoney(all), valorMotorista=0;
  let margem=Number(document.getElementById('impMarg')?.value||10);
  if(valorEmpresa)valorMotorista=valorEmpresa*(1-margem/100);
  return [{cliente,origem:fixPlace(origem),destino:fixPlace(destino),produto,quantidade,valorEmpresa,margem,valorMotorista,data:today(),tipoVeiculo,status:'Disponível',obs:''}];
}
function previewImport(){
  let txt=document.getElementById('impText')?.value||'';
  impList=parseMultiTxt(txt);
  imp=impList[0]||{};
  let p=document.getElementById('prev'); if(!p)return;
  if(impList.length>1){
    p.className='';
    p.innerHTML=`<div class="notice"><b>Foram encontradas ${impList.length} cargas.</b> Confira, desmarque o que não quiser e clique em Criar cargas.</div>`+
    impList.map((c,i)=>`<div class="panel" style="margin-top:10px"><label style="font-weight:900"><input type="checkbox" id="imp_${i}_ok" checked> Criar carga ${i+1}</label><div class="grid" style="margin-top:8px">${[['cliente','Cliente'],['origem','Origem'],['destino','Destino'],['produto','Produto'],['quantidade','Quantidade'],['valorEmpresa','Valor Empresa'],['margem','Margem (%)'],['valorMotorista','Valor Motorista'],['tipoVeiculo','Tipo veículo'],['data','Data']].map(([k,label])=>`<div class="field"><label>${label}</label><input id="imp_${i}_${k}" ${k==='data'?'type="date"':(k.startsWith('valor')||k==='margem'?'type="number" step="0.01"':'')} value="${escapeHtml(c[k]??'')}"></div>`).join('')}</div></div>`).join('');
  }else{
    p.className='grid';
    const fields=[['cliente','Cliente'],['origem','Origem'],['destino','Destino'],['produto','Produto'],['quantidade','Quantidade'],['valorEmpresa','Valor Empresa'],['margem','Margem (%)'],['valorMotorista','Valor Motorista'],['tipoVeiculo','Tipo de veículo'],['data','Data']];
    p.innerHTML=fields.map(([k,label])=>`<div class="field"><label>${label}</label><input id="imp_${k}" ${k==='data'?'type="date"':(k.startsWith('valor')||k==='margem'?'type="number" step="0.01"':'')} value="${escapeHtml(imp[k]??'')}"></div>`).join('')+`<div class="field span2"><label>Observações</label><textarea id="imp_obs">${escapeHtml(imp.obs||'')}</textarea></div>`;
  }
  setImportStatus(impList.length>1?`Prévia gerada com ${impList.length} cargas.`:'Prévia gerada. Confira e clique em Criar carga.');
}
function readImp(k){let el=document.getElementById('imp_'+k); return el?el.value:(imp[k]||'');}
function readMultiImp(i,k){let el=document.getElementById(`imp_${i}_${k}`); return el?el.value:(impList[i]?.[k]||'');}
function createImport(){
  if(!document.getElementById('imp_cliente') && !document.getElementById('imp_0_cliente'))previewImport();
  if(impList.length>1){
    let criadas=0;
    impList.forEach((_,i)=>{
      if(!document.getElementById(`imp_${i}_ok`)?.checked)return;
      let carga={id:crypto.randomUUID(),op:nextOp(),createdAt:Date.now(),cliente:readMultiImp(i,'cliente'),origem:readMultiImp(i,'origem'),destino:readMultiImp(i,'destino'),produto:readMultiImp(i,'produto'),quantidade:readMultiImp(i,'quantidade'),valorEmpresa:Number(readMultiImp(i,'valorEmpresa')||0),margem:Number(readMultiImp(i,'margem')||10),valorMotorista:Number(readMultiImp(i,'valorMotorista')||0),tipoVeiculo:readMultiImp(i,'tipoVeiculo'),data:readMultiImp(i,'data')||today(),status:'Disponível',obs:''};
      if(carga.origem||carga.destino||carga.produto||carga.cliente||carga.valorEmpresa){db.cargas.push(carga); addHist(carga.id,'Carga criada por importação inteligente universal'); criadas++;}
    });
    if(!criadas){alert('Nenhuma carga selecionada ou identificada.');return;}
    save(); alert(criadas+' cargas criadas pela Importação Inteligente.'); go('cargas'); return;
  }
  let carga={id:crypto.randomUUID(),op:nextOp(),createdAt:Date.now(),cliente:readImp('cliente'),origem:readImp('origem'),destino:readImp('destino'),produto:readImp('produto'),quantidade:readImp('quantidade'),valorEmpresa:Number(readImp('valorEmpresa')||0),margem:Number(readImp('margem')||10),valorMotorista:Number(readImp('valorMotorista')||0),tipoVeiculo:readImp('tipoVeiculo'),data:readImp('data')||today(),status:'Disponível',obs:document.getElementById('imp_obs')?.value||''};
  if(!carga.origem&&!carga.destino&&!carga.produto&&!carga.cliente){alert('Não identifiquei dados suficientes para criar a carga.'); return;}
  db.cargas.push(carga); addHist(carga.id,'Carga criada por importação inteligente universal'); save(); alert('Carga criada pela Importação Inteligente.'); go('cargas');
}
