<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>DRO Cargas Sistema Completo V29</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { background: #040b14; color: #f4f7fe; font-family: sans-serif; margin: 0; padding: 20px; }
        .nav-bar { margin-bottom: 20px; }
        .tab-content { display: none; }
        .active { display: block; }
        button { background: #2d8cff; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #0d1728; margin-top: 10px; }
        th, td { padding: 8px; border-bottom: 1px solid #23374f; font-size: 11px; text-align: left; }
        .btn-acao { background: #23374f; font-size: 10px; margin: 2px; }
        .btn-excluir-selecionadas { background: #ff4d4d; margin-left: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #0d1728; padding: 20px; border-radius: 8px; width: 500px; border: 1px solid #2d8cff; max-height: 90vh; overflow-y: auto; }
        input, textarea { width: 100%; margin-bottom: 8px; padding: 8px; background: #040b14; color: white; border: 1px solid #23374f; box-sizing: border-box; }
        input[type="checkbox"] { width: auto; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button onclick="trocarTab('cargas')">Cargas</button>
        <button onclick="trocarTab('motoristas')">Motoristas</button>
        <button onclick="trocarTab('agenda')">Agenda</button>
    </div>

    <!-- ABA CARGAS -->
    <div id="cargas" class="tab-content active">
        <h2>Cargas</h2>
        <input type="text" placeholder="Buscar cargas..." id="buscaCargas" onkeyup="filtrarTabela('lista-cargas', 'buscaCargas')">
        <button>+ Nova Carga</button>
        <button class="btn-excluir-selecionadas" onclick="excluirSelecionadas()">🗑️ Excluir Selecionadas</button>
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selecionarTodos" onclick="alternarTodos(this)"></th>
                    <th></th><th>OP</th><th>Cidade Origem</th><th>Cidade Destino</th><th>Cliente Orig</th><th>Cliente Dest</th>
                    <th>Produto</th><th>Vlr Empresa</th><th>Vlr Mot</th><th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-cargas"></tbody>
        </table>
    </div>

    <!-- ABA MOTORISTAS -->
    <div id="motoristas" class="tab-content">
        <h2>Motoristas</h2>
        <input type="text" placeholder="Pesquisar por placa ou nome..." id="buscaMot" onkeyup="filtrarTabela('lista-motoristas', 'buscaMot')">
        <button onclick="document.getElementById('modalMot').style.display='flex'">+ Cadastrar Motorista</button>
        <table>
            <thead><tr><th>Cavalo</th><th>Motorista</th><th>WhatsApp</th><th>Ações</th></tr></thead>
            <tbody id="lista-motoristas"></tbody>
        </table>
    </div>

    <!-- ABA AGENDA -->
    <div id="agenda" class="tab-content">
        <h2>Agenda / Notas</h2>
        <textarea id="notas" placeholder="Escreva suas anotações aqui..."></textarea>
    </div>

    <!-- MODAIS -->
    <div id="modalMot" class="modal">
        <div class="modal-content">
            <h3>Cadastro Motorista</h3>
            <input type="text" id="cavalo" placeholder="Cavalo">
            <input type="text" id="sreb1" placeholder="S. Reb 1">
            <input type="text" id="sreb2" placeholder="S. Reb 2">
            <input type="text" id="sreb3" placeholder="S. Reb 3">
            <input type="text" id="tipo" placeholder="Tipo de Veículo">
            <input type="text" id="prop" placeholder="Proprietário">
            <input type="text" id="cpfP" placeholder="CPF/CNPJ Prop" onblur="mascaraDoc(this)">
            <input type="text" id="ender" placeholder="Endereço">
            <input type="text" id="mun" placeholder="Município" onblur="formatarCidade(this)">
            <input type="text" id="mot" placeholder="Nome Motorista">
            <input type="text" id="zap" placeholder="Nome no WhatsApp">
            <input type="text" id="cnh" placeholder="CNH Nº">
            <input type="text" id="rg" placeholder="RG">
            <input type="text" id="cpfM" placeholder="CPF Motorista" onblur="mascaraDoc(this)">
            <input type="text" id="tel" placeholder="Telefone">
            <input type="text" id="obs" placeholder="Observação">
            <button onclick="alert('Motorista Salvo')">Salvar</button>
            <button onclick="document.getElementById('modalMot').style.display='none'">Fechar</button>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h3>Editar Carga</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editOp" placeholder="OP">
            <input type="text" id="editCidOrig" placeholder="Cidade Origem">
            <input type="text" id="editCidDest" placeholder="Cidade Destino">
            <input type="text" id="editCliOrig" placeholder="Cliente Origem">
            <input type="text" id="editCliDest" placeholder="Cliente Destino">
            <textarea id="editObs" placeholder="Observações"></textarea>
            <button onclick="alert('Salvando...')">Salvar</button>
            <button onclick="document.getElementById('modalEditar').style.display='none'">Fechar</button>
            <button style="background: #ff4d4d;" onclick="alert('Excluído')">Excluir</button>
        </div>
    </div>

    <div id="modalOrdem" class="modal">
        <div class="modal-content">
            <h3>Gerar Ordem (G10)</h3>
            <input type="text" placeholder="Pesquisar motorista/placa...">
            <input type="text" id="pesoCarga" placeholder="Digite o Peso">
            <button onclick="alert('PDF Gerado')">Gerar PDF</button>
            <button onclick="document.getElementById('modalOrdem').style.display='none'">Fechar</button>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://dro-cargas-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(config);

        function trocarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
        }

        function filtrarTabela(idTabela, idInput) {
            let input = document.getElementById(idInput).value.toUpperCase();
            let table = document.getElementById(idTabela);
            let tr = table.getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                let txt = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = txt.toUpperCase().indexOf(input) > -1 ? "" : "none";
            }
        }

        function alternarTodos(master) {
            let checkboxes = document.querySelectorAll('.check-carga');
            checkboxes.forEach(cb => cb.checked = master.checked);
        }

        function excluirSelecionadas() {
            let checkboxes = document.querySelectorAll('.check-carga:checked');
            if (checkboxes.length === 0) {
                alert("Selecione ao menos uma carga para excluir.");
                return;
            }

            if (confirm(`Deseja realmente excluir as ${checkboxes.length} cargas selecionadas?`)) {
                let dbRef = firebase.database().ref('cargas');
                checkboxes.forEach(cb => {
                    let id = cb.getAttribute('data-id');
                    dbRef.child(id).remove();
                });
                alert("Cargas selecionadas excluídas com sucesso!");
            }
        }

        function editarCarga(id, op, cidOrig, cidDest, cliOrig, cliDest) {
            document.getElementById('editId').value = id;
            document.getElementById('editOp').value = op;
            document.getElementById('editCidOrig').value = cidOrig;
            document.getElementById('editCidDest').value = cidDest;
            document.getElementById('editCliOrig').value = cliOrig;
            document.getElementById('editCliDest').value = cliDest;
            document.getElementById('modalEditar').style.display = 'flex';
        }

        firebase.database().ref('cargas').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('lista-cargas');
            tbody.innerHTML = "";
            for (let id in data) {
                let c = data[id];
                tbody.innerHTML += `<tr>
                    <td><input type="checkbox" class="check-carga" data-id="${id}"></td>
                    <td>${c.origem_cadastro === 'robo' ? '🤖' : '👤'}</td>
                    <td>${c.cn||''}</td>
                    <td>${c.cidadeOrigem||''}</td>
                    <td>${c.cidadeDestino||''}</td>
                    <td>${c.clienteOrigem||''}</td>
                    <td>${c.clienteDestino||''}</td>
                    <td>${c.produto||''}</td>
                    <td>R$ ${parseFloat(c.valor||0).toFixed(2)}</td>
                    <td>R$ ${(parseFloat(c.valor||0) * 0.1).toFixed(2)}</td>
                    <td>
                        <button class="btn-acao" onclick="document.getElementById('modalOrdem').style.display='flex'">Ordem</button>
                        <button class="btn-acao" onclick="editarCarga('${id}', '${c.cn||''}', '${c.cidadeOrigem||''}', '${c.cidadeDestino||''}', '${c.clienteOrigem||''}', '${c.clienteDestino||''}')">Editar</button>
                    </td>
                </tr>`;
            }
        });

        function formatarCidade(el) {
            let val = el.value.replace("-RS", "");
            if(val.trim() !== "") el.value = val.trim() + "-RS";
        }
        function mascaraDoc(el) {
            let v = el.value.replace(/\D/g, "");
            if (v.length === 11) el.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
            else if (v.length === 14) el.value = v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
        }
    </script>
</body>
</html>
