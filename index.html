<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DRO Cargas V11</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { background: #040b14; color: #f4f7fe; font-family: sans-serif; margin: 0; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button { background: #2d8cff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #23374f; background: #0d1728; color: white; width: 250px; }
        table { width: 100%; border-collapse: collapse; background: #0d1728; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #23374f; }
        .btn-acao { font-size: 12px; padding: 5px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2>DRO Cargas V11</h2>
        <input type="text" id="busca" placeholder="Buscar por OP ou Cliente..." onkeyup="filtrar()">
        <button onclick="alert('Formulário em breve!')">+ Nova Carga</button>
    </div>
    <table>
        <thead><tr><th>OP</th><th>Destino</th><th>Origem</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tabela-cargas"></tbody>
    </table>

    <script>
        const config = { databaseURL: "https://dro-cargas-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(config);
        
        let listaCargas = [];

        firebase.database().ref('cargas').on('value', (snapshot) => {
            const data = snapshot.val();
            listaCargas = data ? Object.values(data) : [];
            renderizar(listaCargas);
        });

        function renderizar(dados) {
            const tbody = document.getElementById('tabela-cargas');
            tbody.innerHTML = dados.map(c => `<tr>
                <td>${c.cn}</td><td>${c.destino}</td><td>${c.origem}</td><td>Disponível</td>
                <td>
                    <button class="btn-acao" onclick="alert('Agendar ${c.cn}')">Agendar</button>
                    <button class="btn-acao" onclick="alert('Manifestar ${c.cn}')">Manifestar</button>
                </td>
            </tr>`).join('');
        }

        function filtrar() {
            const busca = document.getElementById('busca').value.toLowerCase();
            const filtrados = listaCargas.filter(c => c.cn.toLowerCase().includes(busca) || c.destino.toLowerCase().includes(busca));
            renderizar(filtrados);
        }
    </script>
</body>
</html>
