const KEY='DRO_CARGAS_DATA'; const MASTER='DRO_CARGAS_MASTER'; const OLD=['DRO_CARGAS_MASTER','DRO_CARGAS_DATA','droCargasData','DRO_CARGAS_V19','DRO_CARGAS_V20','dro-cargas'];
let page='dashboard', search='', editId=null; let orderCargaId='', orderMotoristaId='', orderVeiculoId='', orderCargaFilter='', orderMotFilter='', orderVeiFilter=''; let simpleFilters={clientes:'',motoristas:'',veiculos:''}; let manFilter={motorista:'',placa:'',agendado:'',manifestado:'',carregado:'',transito:'',finalizado:''};
let db=load();
const pages=[['dashboard','🏠','Dashboard'],['rascunhos','📝','Rascunhos'],['agenda','🗓️','Agenda'],['cargas','🚛','Cargas'],['importar','📥','Importação Inteligente'],['agendamentos','📋','Agendamentos'],['manifestos','📄','Manifestos'],['ordemg10','🧾','Ordem G10'],['clientes','👥','Clientes'],['motoristas','👤','Motoristas/Veículos'],['anuncios','📣','Anúncios'],['relatorios','📊','Relatórios']];
function defaultDb(){return{cargas:[],agendamentos:[],manifestos:[],clientes:[],motoristas:[],veiculos:[],anuncios:[],agenda:[],historico:[],rascunho:'',lastOp:0,version:'4.0'}}
function load(){let d=null; for(const k of OLD){let o=localStorage.getItem(k); if(o){d=o; break}} try{let x=d?JSON.parse(d):defaultDb(); return Object.assign(defaultDb(),x)}catch(e){return defaultDb()}}
function save(){const payload=JSON.stringify(db); localStorage.setItem(KEY,payload); localStorage.setItem(MASTER,payload); try{localStorage.setItem('DRO_CARGAS_V35_ULTIMO',payload)}catch(e){}}
function login(){const e=document.getElementById('email').value.trim(); const s=document.getElementById('senha').value.trim(); if(e!=='diego@drocargas.com'||s!=='123456'){alert('E-mail ou senha incorretos.'); return;} sessionStorage.setItem('DRO_CARGAS_SESSAO','1');document.getElementById('login').classList.remove('show');document.getElementById('login').style.display='none'; page='dashboard'; render()}
function logout(){sessionStorage.removeItem('DRO_CARGAS_SESSAO'); document.getElementById('login').style.display='flex'; document.getElementById('login').classList.add('show');}
function toggleSide(){let s=document.getElementById('side'); s.classList.toggle('closed'); s.querySelector('.toggle').textContent=s.classList.contains('closed')?'▶':'◀'}
function go(p){page=p; search=''; render()}
function renderNav(){document.getElementById('nav').innerHTML=pages.map(p=>`<a title="${p[2]}" class="${page==p[0]?'active':''}" onclick="go('${p[0]}')"><span class="ico">${p[1]}</span><span class="label">${p[2]}</span></a>`).join('')}
function render(){normalize(); save(); renderNav(); const m=document.getElementById('main'); const title=pages.find(x=>x[0]==page)?.[2]||''; if(page==='dashboard') return dashboard(m); if(page==='rascunhos') return rascunhosPage(m); if(page==='cargas') return cargasPage(m); if(page==='agendamentos') return agPage(m); if(page==='manifestos') return manPage(m); if(page==='ordemg10') return ordemG10Page(m); if(page==='anuncios') return adsPage(m); if(page==='pendencias') return pendPage(m); if(page==='importar') return importPage(m); if(page==='clientes') return simplePage(m,'clientes','Clientes',['nome','cidade','uf','contato','cnpj','localizacao','telefone','email','observacoes']); if(page==='motoristas') return motorVeiculoPage(m); if(page==='veiculos') return motorVeiculoPage(m); if(page==='agenda') return simplePage(m,'agenda','Agenda',['titulo','descricao','data']); if(page==='relatorios') return reports(m);}
function topHtml(title,sub='Resumo operacional do DRO Cargas'){return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions"><button class="btn" onclick="backup()">Backup JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restaurar Backup</button><button class="primary" onclick="openCarga()">+ Nova Carga</button><button class="ghost" onclick="go('importar')">📥 Importação Inteligente</button><button class="dark" onclick="logout()">Sair</button></div></div>`}
function statusClass(s){return String(s||'Disponível').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('Em transito','Transito')}
function dateBR(d){if(!d)return''; if(d.includes('/'))return d; let [y,m,da]=d.split('-'); return y&&m&&da?`${da}/${m}/${y}`:d}
function today(){return new Date().toISOString().slice(0,10)}
function currency(v){let n=Number(String(v||0).replace(',','.'))||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function nextOp(){let max=Math.max(0,...db.cargas.map(c=>parseInt(c.op)||0),db.lastOp||0); db.lastOp=max+1; return String(db.lastOp).padStart(3,'0')}
function sortedCargas(){return [...db.cargas].sort((a,b)=>(parseInt(b.op)||0)-(parseInt(a.op)||0))}
function normalize(){
  db.cargas.forEach(c=>{
    if(!c.op)c.op=nextOp();
    if(!c.id)c.id=crypto.randomUUID();
    if(!c.data)c.data=today();
    if(c.status==='ativo')c.status='Disponível';
    if(!c.status)c.status='Disponível';
    c.valorEmpresa=Number(c.valorEmpresa ?? c.valor ?? 0);
    c.margem=Number(c.margem ?? 10);
    c.valorMotorista=Number(c.valorMotorista ?? c.valorEmpresa*(1-c.margem/100));
  });
  db.agendamentos.forEach(a=>{if(!a.id)a.id=crypto.randomUUID();});
  db.manifestos.forEach(m=>{
    if(!m.id)m.id=crypto.randomUUID();
    m.agendado=true;
    m.manifestado=!!m.manifestado;
    m.carregado=!!m.carregado;
    m.transito=!!m.transito;
    m.finalizado=!!m.finalizado;
    if(m.finalizado){m.manifestado=true; m.carregado=true; m.transito=true;}
    else if(m.transito){m.manifestado=true; m.carregado=true;}
    else if(m.carregado){m.manifestado=true;}
    let c=db.cargas.find(x=>x.id===m.cargaId);
    // Regra principal: o Manifesto é a fonte da verdade do fluxo operacional.
    // Nunca apagar marcações feitas pelo usuário ao trocar de tela.
    if(c){
      if(m.finalizado)c.status='Finalizado';
      else if(m.transito)c.status='Em trânsito';
      else if(m.carregado)c.status='Carregado';
      else if(m.manifestado)c.status='Manifestado';
      else if(m.agendado)c.status='Agendado';
    }
  });
}

function saveManifesto(id){
  let f=db.manifestos.find(x=>x.id===id); if(!f)return;
  const get=k=>!!document.getElementById(`mf_${id}_${k}`)?.checked;
  let novo={manifestado:get('manifestado'),carregado:get('carregado'),transito:get('transito'),finalizado:get('finalizado')};
  if(novo.finalizado && !novo.transito){alert('Para finalizar, marque primeiro Em trânsito.'); return;}
  if(novo.transito && !novo.carregado){alert('Para marcar Em trânsito, marque primeiro Carregado.'); return;}
  if(novo.carregado && !novo.manifestado){alert('Para marcar Carregado, marque primeiro Manifestado.'); return;}
  if(!novo.manifestado){novo.carregado=false; novo.transito=false; novo.finalizado=false;}
  if(!novo.carregado){novo.transito=false; novo.finalizado=false;}
  if(!novo.transito){novo.finalizado=false;}
  f.agendado=true; f.manifestado=novo.manifestado; f.carregado=novo.carregado; f.transito=novo.transito; f.finalizado=novo.finalizado;
  let c=db.cargas.find(x=>x.id===f.cargaId);
  if(c){
    if(f.finalizado)c.status='Finalizado';
    else if(f.transito)c.status='Em trânsito';
    else if(f.carregado)c.status='Carregado';
    else if(f.manifestado)c.status='Manifestado';
    else c.status='Agendado';
    addHist(c.id,'Manifesto salvo: '+c.status);
  }
  normalize(); save(); alert('Manifesto salvo.'); render();
}

function normalizeTextBasic(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();}
function cleanOCR(s){
  return String(s||'')
    .replace(/\r/g,'\n')
    .replace(/[|]+/g,'\n')
    .replace(/—|–/g,' → ')
    .replace(/\bCOTR1SAL\b/gi,'COTRISAL')
    .replace(/\bAGROFELAUGUSTO\b/gi,'AGROFEL AUGUSTO')
    .replace(/AGROFEL([A-ZÁÉÍÓÚÃÕÇ])/g,'AGROFEL $1')
    .replace(/COTRISAL([A-ZÁÉÍÓÚÃÕÇ])/g,'COTRISAL $1')
    .replace(/OLEOPLAN([A-ZÁÉÍÓÚÃÕÇ])/g,'OLEOPLAN $1')
    .replace(/BOCCHI([A-ZÁÉÍÓÚÃÕÇ])/g,'BOCCHI $1')
    .replace(/SOJA\s*A?\s*GRANEL|SOJAAGRANEL/gi,'SOJA A GRANEL')
    .replace(/SOJA\s*BENEFICIADA/gi,'SOJA BENEFICIADA')
    .replace(/FARELO\s*DE\s*SOJA|FARELEDESOJA|FARELODESOJA/gi,'FARELO DE SOJA')
    .replace(/PORTO\s*RIO\s*GRANDE|PORTORIOGRANDE/gi,'PORTO RIO GRANDE')
    .replace(/RIOGRANDE/gi,'RIO GRANDE')
    .replace(/CAPA[OD]O\s*DO\s*LEAO|CAPADDOLEAO|CAPAO\s*DO\s*LEAO/gi,'CAPAO DO LEAO')
    .replace(/STO\.?\s*EXPEDITO/gi,'STO. EXPEDITO')
    .replace(/\s+/g,' ')
    .trim();
}
function titleCaseFrete(s){return String(s||'').replace(/\s+/g,' ').trim().toUpperCase();}
function numBR(v){let s=String(v||'').replace(/[^0-9,\.]/g,''); if(!s)return 0; if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(','))s=s.replace(',','.'); return Number(s)||0}
function extractProduct(t){let m=String(t||'').match(/\b(SOJA\s+A\s+GRANEL|SOJA\s+BENEFICIADA(?:\s*-?\s*FIXO)?|FARELO\s+DE\s+SOJA(?:\s+PRO\s*45,?5\s*MI?)?|FARELO|MILHO|TRIGO|ARROZ|DDG|UREIA|FERTILIZANTE|CALC[ÁA]RIO)\b/i); return m?titleCaseFrete(m[1].replace(/\s*-\s*FIXO/i,' - FIXO')):''}
function extractVehicle(t){let m=String(t||'').match(/\b(SOMENTE\s+)?(\d+\s*EIXOS?|LS|BITREM|RODOTREM|TRUCK|GRANELEIRO|BASCULANTE|CA[CÇ]AMBA)\b/i); return m?titleCaseFrete(m[0].replace(/^SOMENTE\s+/i,'')):''}
function extractValue(t){let m=String(t||'').match(/R\$\s*([0-9.]+,?\d{0,2})/i) || String(t||'').match(/\b([0-9]{2,4},\d{2})\b/); return m?numBR(m[1]):0}
function findKnownCompany(t){let raw=normalizeTextBasic(t); let known=['AGROFEL','COTRISAL','CARGILL','BUNGE','LDC','OLEOPLAN','COFCO','BOCCHI','BIANCHINI','MOINHO NORDESTE','CAMIL','ADM','GRANJA PINHEIROS']; return known.find(k=>raw.includes(k))||'';}
function validRoutePart(s){s=cleanOCR(s); return s && !/^(RODO|BR|CN|MODAL|DATA|COTA|OP|PRODUTO|FRETE|TURNO|AS|DISP|USO)$/i.test(s);}
function splitRouteWhats(line){
  let routeLine=cleanOCR(line).replace(/\s+X\s+/i,' x ');
  let parts=routeLine.split(/\s+x\s+|\s*→\s*/i);
  if(parts.length<2)parts=routeLine.split(/\s+-\s+(?=[A-ZÁÉÍÓÚÃÕÇ].*\/RS|[A-ZÁÉÍÓÚÃÕÇ].*\/PR|[A-ZÁÉÍÓÚÃÕÇ].*\/SC)/i);
  if(parts.length>=2)return [cleanOCR(parts[0]), cleanOCR(parts.slice(1).join(' '))];
  return ['',''];
}
function parseWhatsapp(t){
  let raw=cleanOCR(t), lines=String(t||'').split(/\n+/).map(x=>cleanOCR(x)).filter(Boolean);
  let value=extractValue(raw), product=extractProduct(raw), vehicle=extractVehicle(raw);
  let routeLine=lines.find(l=>/(\/RS|\/PR|\/SC|\/SP|\/GO|\/MT|\/MS).*(\sx\s|→|\s-\s).*(\/RS|\/PR|\/SC|\/SP|\/GO|\/MT|\/MS)/i.test(l)) || lines.find(l=>/\sx\s|→/.test(l)) || raw;
  let [origem,destino]=splitRouteWhats(routeLine);
  if(!origem||!destino){
    let pin=lines.findIndex(l=>/📍|ORIGEM/i.test(l));
    let flag=lines.findIndex(l=>/🏁|DESTINO/i.test(l));
    if(pin>=0)origem=cleanOCR(lines[pin].replace(/📍|ORIGEM:?/ig,''));
    if(flag>=0)destino=cleanOCR(lines[flag].replace(/🏁|DESTINO:?/ig,''));
  }
  let cliente=findKnownCompany(raw);
  return {cliente,origem,destino,produto:product,quantidade:'',valorEmpresa:value,margem:Number(document.getElementById('impMarg')?.value||10),valorMotorista:value*(1-Number(document.getElementById('impMarg')?.value||10)/100),data:today(),tipoVeiculo:vehicle,status:'Disponível',obs:''};
}
function tableSegments(t){
  let raw=String(t||'').replace(/\r/g,'\n');
  let byLine=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let rows=byLine.filter(l=>/\bRODO\b/i.test(l)&&/\b(SOJA|FARELO|MILHO|TRIGO|ARROZ)\b/i.test(l));
  if(rows.length>=2)return rows;
  let compact=raw.replace(/\n/g,' ').replace(/\s+/g,' ');
  let parts=compact.split(/(?=\b(?:aa\s+|\d+\s+|BR\s+)?RODO\s+\d{3,6}\b)/i).map(x=>x.trim()).filter(x=>/\bRODO\s+\d{3,6}\b/i.test(x));
  return parts;
}
function splitColumnsPreserve(seg){
  let line=String(seg||'').replace(/\t/g,'    ').replace(/\r/g,' ').trim();
  let cols=line.split(/\s{2,}/).map(cleanOCR).filter(Boolean);
  if(cols.length>=8)return cols;
  return [];
}
function parseTableByColumns(seg){
  let cols=splitColumnsPreserve(seg); if(!cols.length)return null;
  let idx=cols.findIndex(c=>/^RODO$/i.test(c)||/RODO\s+\d/i.test(c));
  let cnIdx=cols.findIndex(c=>/^\d{3,6}(\s*\(?\d+\)?)?$/.test(c));
  let start = idx>=0 ? idx+2 : (cnIdx>=0?cnIdx+1:0);
  // Remove colunas iniciais de ícones/data/modal/cn quando existirem
  let fields=cols.slice(start);
  if(fields.length<5)return null;
  let productIndex=fields.findIndex(f=>extractProduct(f));
  if(productIndex<4)return null;
  let value=0;
  let valCol=fields[productIndex+1]||'';
  if(/\b\d{2,4}\b/.test(valCol))value=Number((valCol.match(/\b(\d{2,4})\b/)||[])[1])||0;
  return buildCarga(fields[0], fields[2], fields[3], extractProduct(fields[productIndex]), value, '');
}
function buildCarga(cliente,origem,destino,produto,valor,veiculo){
  let mg=Number(document.getElementById('impMarg')?.value||10), ve=Number(valor||0);
  return {cliente:titleCaseFrete(cliente),origem:titleCaseFrete(origem),destino:titleCaseFrete(destino),produto:titleCaseFrete(produto),quantidade:'',valorEmpresa:ve,margem:mg,valorMotorista:ve*(1-mg/100),data:today(),tipoVeiculo:titleCaseFrete(veiculo||''),status:'Disponível',obs:''};
}
function tokenizePlaces(s){
  s=cleanOCR(s);
  const prefixes=['AGROFEL','BOCCHI','COTRISAL','ILTON SCHIO BALZAN','GRANJA PINHEIROS-GRAO PARA','GRANJA PINHEIROS','JONATAN CEREZER BULIGON','MAURICIO SILVEIRA COSTA','TRES TENTOS-VACARIA','JOCELITO BOEIRA RODRIGUES','RIO PARDO - GRANELEIRA','PORTO RIO GRANDE - RS','PORTO RIO GRANDE','BIANCHINI-RIO GRANDE','CAPAO DO LEAO'];
  let found=[];
  for(const p of prefixes){let re=new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m; while((m=re.exec(s)))found.push({p:cleanOCR(m[0]),i:m.index});}
  found.sort((a,b)=>a.i-b.i);
  // cria blocos iniciando em prefixos conhecidos
  let blocks=[];
  for(let i=0;i<found.length;i++){
    let a=found[i], b=found[i+1];
    let txt=s.slice(a.i,b?b.i:undefined).trim();
    if(txt && !blocks.includes(txt))blocks.push(txt);
  }
  return blocks.map(cleanOCR).filter(validRoutePart);
}
function parseTableLine(seg){
  let byCols=parseTableByColumns(seg); if(byCols && isStrongUseful(byCols))return byCols;
  let s=cleanOCR(seg);
  let product=extractProduct(s);
  let value=0;
  if(product){
    let pEsc=product.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    let m=s.match(new RegExp(pEsc+'\\s+(?:PRO\\s*45,?5\\s*MI\\s*)?(\\d{2,4})\\b','i'));
    if(m)value=Number(m[1])||0;
  }
  if(!value){let nums=[...s.matchAll(/\b(\d{2,4})(?=\s*(?:07:|08:|19:|AS|$))/gi)].map(m=>Number(m[1])).filter(n=>n>=20&&n<=999); if(nums.length)value=nums[0];}
  let beforeProduct=product?s.split(new RegExp(product.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'),'i'))[0]:s;
  let afterRodo=(beforeProduct.match(/\bRODO\s+\d{3,6}\s*(?:\(?\s*\d{4,6}\s*\)?)?\s+(.+)/i)||[])[1]||beforeProduct;
  afterRodo=afterRodo.replace(/^\d{1,2}\s+/,'').replace(/^BR\s+/i,'');
  let blocks=tokenizePlaces(afterRodo);
  let cliente='', origem='', destino='';
  if(blocks.length>=4){cliente=blocks[0]; origem=blocks[blocks.length-2]; destino=blocks[blocks.length-1];}
  else if(blocks.length===3){cliente=blocks[0]; origem=blocks[1]; destino=blocks[2];}
  else if(blocks.length===2){origem=blocks[0]; destino=blocks[1]; cliente=findKnownCompany(s);}
  else {cliente=findKnownCompany(s);}
  // destinos comuns no fim do registro
  let destMatch=s.match(/\b(PORTO RIO GRANDE\s*-\s*RS|BIANCHINI\s*-?\s*RIO GRANDE|GRANJA PINHEIROS\s*-?\s*GRAO PARA|AGROFEL\s+CAPAO DO LEAO|BOCCHI\s*-?\s*MUITOS CAPOES)\b/i);
  if(destMatch)destino=cleanOCR(destMatch[1]);
  if(!origem && blocks.length>=2)origem=blocks[blocks.length-2];
  return buildCarga(cliente,origem,destino,product,value,'');
}
function isStrongUseful(c){return !!((c.origem&&c.destino) || (c.produto&&c.valorEmpresa) || (c.cliente&&c.produto&&c.destino));}
function isUseful(c){return isStrongUseful(c) || !!(c.origem||c.destino||c.produto||c.valorEmpresa||c.cliente)}
function parseImportAll(t){
  let text=String(t||'');
  let segs=tableSegments(text);
  let out=[];
  if(segs.length>=2 || (segs.length===1 && /\bRODO\b/i.test(text))){
    out=segs.map(parseTableLine).filter(isStrongUseful);
  } else {
    out=[parseWhatsapp(text)].filter(isUseful);
  }
  if(!out.length && text.trim())out=[parseWhatsapp(text)].filter(isUseful);
  return out;
}

  </div></div>`).join('');

function createImport(){
  if(!impList.length)previewImport();
  let created=0, ignored=0;
  impList.forEach((c,i)=>{
    let sel=document.getElementById(`imp_sel_${i}`); if(sel&&!sel.checked)return;
    let carga={id:crypto.randomUUID(),op:nextOp(),createdAt:Date.now(),cliente:valImp(i,'cliente'),origem:valImp(i,'origem'),destino:valImp(i,'destino'),produto:valImp(i,'produto'),quantidade:valImp(i,'quantidade'),valorEmpresa:Number(valImp(i,'valorEmpresa')||0),margem:Number(valImp(i,'margem')||10),valorMotorista:Number(valImp(i,'valorMotorista')||0),tipoVeiculo:valImp(i,'tipoVeiculo'),data:valImp(i,'data')||today(),status:'Disponível',obs:'Criada por Importação Inteligente'};
    if(!isUseful(carga)){ignored++; return;}

  });

async function showImg(file){
  let r=new FileReader(); r.onload=async()=>{
    drop.innerHTML=`<img src="${r.result}"><p>Imagem recebida. Fazendo OCR...</p>`;
    if(window.Tesseract){
      try{
        impSetStatus('Lendo imagem...');
        const ret=await Tesseract.recognize(file,'por+eng');
        document.getElementById('impText').value=(ret.data&&ret.data.text)||'';
        previewImport();
      }catch(e){console.error(e); impSetStatus('Não consegui ler a imagem. Cole o texto manualmente.');}
    }else{impSetStatus('OCR indisponível. Cole o texto manualmente.')}
  }; r.readAsDataURL(file)
}

  wrap.style.background='#fff';
  wrap.style.padding='0';
  wrap.style.margin='0';
  wrap.style.zIndex='-1';
  wrap.style.opacity='1';
  const clone=doc.cloneNode(true);
  clone.removeAttribute('id');
  clone.style.margin='0 auto';
  clone.style.width='900px';
  clone.style.maxWidth='900px';
  clone.style.transform='none';
  clone.style.position='static';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  try{
    await Promise.all([...clone.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res;})));
    await html2pdf().set({
      margin:[6,6,6,6],
      filename,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:1000,windowHeight:clone.scrollHeight},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['avoid-all','css','legacy']}
    }).from(clone).save();
  }catch(e){
    console.error(e);
    alert('Não consegui salvar o PDF automático. Vou abrir a impressão para você salvar como PDF.');
    window.print();
  }finally{
    wrap.remove();
  }
}

function rascunhosPage(m){
  m.innerHTML=topHtml('Rascunhos','Bloco simples para anotar textos rápidos')+`<div class="panel"><div class="field"><label>Escreva aqui</label><textarea id="rascunhoTxt" style="min-height:420px" placeholder="Anote aqui fretes, telefones, ideias ou lembretes...">${escapeHtml(db.rascunho||'')}</textarea></div><br><button class="green" onclick="saveRascunho()">Salvar</button> <button class="btn" onclick="clearRascunho()">Limpar</button><p class="sub">O rascunho fica salvo neste navegador.</p></div>`
}
function saveRascunho(){db.rascunho=document.getElementById('rascunhoTxt').value; save(); alert('Rascunho salvo.')}
function clearRascunho(){if(confirm('Limpar todo o rascunho?')){db.rascunho=''; save(); render()}}
function escapeHtml(v){return String(v??'').replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function niceLabel(f){return ({nome:'Nome',nomeWhatsapp:'Nome no WhatsApp',cidade:'Cidade',municipio:'Município',uf:'UF',contato:'Contato',cnpj:'CNPJ',localizacao:'Localização (link)',telefone:'Telefone',email:'E-mail',observacoes:'Observações',placa:'Placa',placaCavalo:'Placa Cavalo',placaCarreta:'Placa Carreta / S. Reb.',tipo:'Tipo',motorista:'Motorista',situacao:'Situação',tipoVeiculo:'Tipo veículo',titulo:'Título',descricao:'Descrição',data:'Data',cpf:'CPF',rg:'RG',cnh:'CNH',veiculoId:'Veículo vinculado',proprietario:'Proprietário',cpfCnpjProprietario:'CPF/CNPJ Proprietário',rntrc:'RNTRC'}[f]||f)}
function simplePage(m,key,title,fields){
  const filter=simpleFilters[key]||'';
  const q=filter.toLowerCase();
  const rows=(db[key]||[]).filter(i=>!q||fields.some(f=>String(i[f]||'').toLowerCase().includes(q))).sort((a,b)=>String(a.nome||a.placa||a.titulo||'').localeCompare(String(b.nome||b.placa||b.titulo||''),'pt-BR'));
  const filterHtml=['clientes','motoristas','veiculos'].includes(key)?`<input class="search" placeholder="Filtrar ${title.toLowerCase()}..." value="${escapeHtml(filter)}" oninput="simpleFilters['${key}']=this.value;render()">`:'';
  m.innerHTML=topHtml(title,'Cadastro')+`<div class="panel"><div class="toolbar"><div>${filterHtml}</div><button class="primary" onclick="openSimple('${key}','${title}',${JSON.stringify(fields).replaceAll('"','&quot;')})">+ Novo</button></div><div class="tableWrap"><table class="table"><thead><tr>${fields.slice(0,6).map(f=>`<th>${niceLabel(f)}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.length?rows.map(i=>`<tr>${fields.slice(0,6).map(f=>`<td>${f==='localizacao'&&i[f]?`<a href="${i[f]}" target="_blank">Abrir Maps</a>`:escapeHtml(i[f]||'')}</td>`).join('')}<td><button class="btn small" onclick="editSimple('${key}','${i.id}',${JSON.stringify(fields).replaceAll('"','&quot;')},'${title}')">Editar</button> <button class="red small" onclick="delSimple('${key}','${i.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="7">Nenhum cadastro.</td></tr>'}</tbody></table></div></div>`
}
function openSimple(key,title,fields){openModal(`<h2>Novo ${title}</h2><div class="grid">${fields.map(f=>simpleInputField(f,{})).join('')}</div><br><button class="green" onclick="saveSimple('${key}',${JSON.stringify(fields).replaceAll('\"','&quot;')})">Salvar</button> <button class="btn" onclick="closeModal()">Fechar</button>`)}
function editSimple(key,id,fields,title){let item=db[key].find(x=>x.id===id); if(!item)return; openModal(`<h2>Editar ${title}</h2><div class="grid">${fields.map(f=>simpleInputField(f,item)).join('')}</div><br><button class="green" onclick="updateSimple('${key}','${id}',${JSON.stringify(fields).replaceAll('\"','&quot;')})">Salvar</button> <button class="btn" onclick="closeModal()">Fechar</button>`)}
function saveSimple(key,fields){let obj={id:crypto.randomUUID()}; fields.forEach(f=>obj[f]=document.getElementById('s_'+f).value); db[key].push(obj); save(); closeModal(); render()}
function updateSimple(key,id,fields){let obj=db[key].find(x=>x.id===id); if(!obj)return; fields.forEach(f=>obj[f]=document.getElementById('s_'+f).value); save(); closeModal(); render()}
function delSimple(key,id){if(confirm('Excluir cadastro?')){db[key]=db[key].filter(x=>x.id!==id); save(); render()}}
function veiculoLabelById(id){let v=db.veiculos.find(x=>x.id===id); return v?`${v.placaCavalo||v.placa||''} / ${v.placaCarreta||''}`:''}
function motorVeiculoPage(m){
  const fm=(simpleFilters.motoristas||'').toLowerCase();
  const fv=(simpleFilters.veiculos||'').toLowerCase();
  const motFields=['nome','nomeWhatsapp','telefone','cpf','rg','cnh','municipio','uf','veiculoId','placa','observacoes'];
  const veiFields=['placaCavalo','placaCarreta','tipo','motorista','proprietario','cpfCnpjProprietario','municipio','uf','rntrc','observacoes'];
  const motors=(db.motoristas||[]).filter(i=>!fm||JSON.stringify(i).toLowerCase().includes(fm));
  const veis=(db.veiculos||[]).filter(i=>!fv||JSON.stringify(i).toLowerCase().includes(fv));
  m.innerHTML=topHtml('Motoristas e Caminhões','Cadastre tudo em uma única aba para gerar a Ordem G10')+`
  <div class="panel"><div class="toolbar"><h2>Motoristas</h2><div><input class="search" placeholder="Filtrar motorista, WhatsApp, CPF..." value="${escapeHtml(simpleFilters.motoristas||'')}" oninput="simpleFilters.motoristas=this.value;render()"> <button class="primary" onclick="openSimple('motoristas','Motorista',${JSON.stringify(motFields).replaceAll('"','&quot;')})">+ Novo Motorista</button></div></div>
  <div class="tableWrap"><table class="table"><thead><tr><th>Nome</th><th>Nome WhatsApp</th><th>Telefone</th><th>CPF</th><th>CNH</th><th>Caminhão vinculado</th><th>Ações</th></tr></thead><tbody>${motors.length?motors.map(i=>`<tr><td>${escapeHtml(i.nome||'')}</td><td>${escapeHtml(i.nomeWhatsapp||'')}</td><td>${escapeHtml(i.telefone||'')}</td><td>${escapeHtml(i.cpf||'')}</td><td>${escapeHtml(i.cnh||'')}</td><td>${escapeHtml(veiculoLabelById(i.veiculoId)||i.placa||'')}</td><td><button class="btn small" onclick="editSimple('motoristas','${i.id}',${JSON.stringify(motFields).replaceAll('"','&quot;')},'Motorista')">Editar</button> <button class="red small" onclick="delSimple('motoristas','${i.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="7">Nenhum motorista cadastrado.</td></tr>'}</tbody></table></div></div>
  <div class="panel"><div class="toolbar"><h2>Caminhões / Veículos</h2><div><input class="search" placeholder="Filtrar placa, proprietário..." value="${escapeHtml(simpleFilters.veiculos||'')}" oninput="simpleFilters.veiculos=this.value;render()"> <button class="primary" onclick="openSimple('veiculos','Caminhão / Veículo',${JSON.stringify(veiFields).replaceAll('"','&quot;')})">+ Novo Caminhão</button></div></div>
  <div class="tableWrap"><table class="table"><thead><tr><th>Cavalo</th><th>S.Reb.</th><th>Tipo</th><th>Proprietário</th><th>CPF/CNPJ</th><th>Município</th><th>Ações</th></tr></thead><tbody>${veis.length?veis.map(i=>`<tr><td>${escapeHtml(i.placaCavalo||i.placa||'')}</td><td>${escapeHtml(i.placaCarreta||'')}</td><td>${escapeHtml(i.tipo||'')}</td><td>${escapeHtml(i.proprietario||'')}</td><td>${escapeHtml(i.cpfCnpjProprietario||'')}</td><td>${escapeHtml(i.municipio||'')} ${i.uf?'- '+escapeHtml(i.uf):''}</td><td><button class="btn small" onclick="editSimple('veiculos','${i.id}',${JSON.stringify(veiFields).replaceAll('"','&quot;')},'Caminhão / Veículo')">Editar</button> <button class="red small" onclick="delSimple('veiculos','${i.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="7">Nenhum caminhão cadastrado.</td></tr>'}</tbody></table></div></div>`
}
function simpleInputField(f,item={}){
  if(f==='veiculoId')return `<div class="field"><label>${niceLabel(f)}</label><select id="s_${f}"><option value="">Selecionar caminhão...</option>${(db.veiculos||[]).map(v=>`<option value="${v.id}" ${item[f]===v.id?'selected':''}>${escapeHtml((v.placaCavalo||v.placa||'')+' / '+(v.placaCarreta||'')+' - '+(v.proprietario||''))}</option>`).join('')}</select></div>`;
  if(f==='observacoes')return `<div class="field span2"><label>${niceLabel(f)}</label><textarea id="s_${f}">${escapeHtml(item[f]||'')}</textarea></div>`;
  return `<div class="field"><label>${niceLabel(f)}</label><input id="s_${f}" value="${escapeHtml(item[f]||'')}"></div>`;
}

function reports(m){let totalTon=db.cargas.reduce((s,c)=>s+(parseFloat(String(c.quantidade).replace(',','.'))||0),0); m.innerHTML=topHtml('Relatórios','Resumo simples')+`<div class="cards"><div class="card">Cargas<b>${db.cargas.length}</b></div><div class="card">Toneladas aprox.<b>${totalTon}</b></div><div class="card">Anúncios<b>${db.anuncios.length}</b></div></div>`}
function addHist(cargaId,txt){db.historico.push({id:crypto.randomUUID(),cargaId,txt,data:today(),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})})}
function backup(){let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})); a.download='backup-dro-cargas.json'; a.click()}
function restoreBackup(e){let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{db=Object.assign(defaultDb(),JSON.parse(r.result)); normalize(); save(); alert('Backup restaurado.'); render()}catch(err){alert('Arquivo inválido')}}; r.readAsText(f)}
if(sessionStorage.getItem('DRO_CARGAS_SESSAO')==='1'){document.getElementById('login').classList.remove('show');document.getElementById('login').style.display='none';page='dashboard';render();}else{document.getElementById('login').style.display='flex';document.getElementById('login').classList.add('show');}
