function nextOp(){let max=Math.max(0,...db.cargas.map(c=>parseInt(c.op)||0),db.lastOp||0); db.lastOp=max+1; return String(db.lastOp).padStart(3,'0')}
function sortedCargas(){return [...db.cargas].sort((a,b)=>(parseInt(b.op)||0)-(parseInt(a.op)||0))}
function cotacaoKey(c){return [c.op||'',c.data||'',c.origem||'',c.destino||'',c.produto||'',c.valorEmpresa||0].join('|')}
function recordCotacao(c){
  if(!c)return;
  if(!db.cotacoes)db.cotacoes=[];
  const item={id:crypto.randomUUID(),cargaId:c.id||'',op:c.op||'',dataLancada:c.data||today(),cliente:c.cliente||'',origem:c.origem||'',destino:c.destino||'',produto:c.produto||'',valorEmpresa:Number(c.valorEmpresa||0),createdAt:Date.now()};
  if(!item.origem&&!item.destino&&!item.valorEmpresa)return;
  const k=cotacaoKey(item);
  if(!db.cotacoes.some(x=>cotacaoKey(x)===k))db.cotacoes.push(item);
}
function ensureCotacoes(){
  if(!db.cotacoes)db.cotacoes=[];
  db.cargas.forEach(c=>recordCotacao(c));
}

function normalize(){
  ensureCotacoes();
  db.cargas.forEach(c=>{
    if(!c.op)c.op=nextOp();
    if(!c.id)c.id=crypto.randomUUID();
    if(!c.data)c.data=today();
    if(c.status==='ativo')c.status='Disponível';
    if(!c.status)c.status='Disponível';
    c.valorEmpresa=Number(c.valorEmpresa ?? c.valor ?? 0);
    c.margem=Number(c.margem ?? 10);
    c.valorMotorista=Number(c.valorMotorista ?? c.valorEmpresa*(1-c.margem/100));
  });
  db.agendamentos.forEach(a=>{if(!a.id)a.id=crypto.randomUUID();});
  db.manifestos.forEach(m=>{
    if(!m.id)m.id=crypto.randomUUID();
    m.agendado=true;
    m.manifestado=!!m.manifestado;
    m.carregado=!!m.carregado;
    m.transito=!!m.transito;
    m.finalizado=!!m.finalizado;
    if(m.finalizado){m.manifestado=true; m.carregado=true; m.transito=true;}
    else if(m.transito){m.manifestado=true; m.carregado=true;}
    else if(m.carregado){m.manifestado=true;}
    let c=db.cargas.find(x=>x.id===m.cargaId);
    // Regra principal: o Manifesto é a fonte da verdade do fluxo operacional.
    // Nunca apagar marcações feitas pelo usuário ao trocar de tela.
    if(c){
      if(m.finalizado)c.status='Finalizado';
      else if(m.transito)c.status='Em trânsito';
      else if(m.carregado)c.status='Carregado';
      else if(m.manifestado)c.status='Manifestado';
      else if(m.agendado)c.status='Agendado';
    }
  });
}

function seedClientesLocalizacoes(){
  if(localStorage.getItem('DRO_CARGAS_V8_CLIENTES_LOCALIZACOES_OK') && db.clientes && db.clientes.length>0) return;
  if(!db.clientes) db.clientes=[];
  CLIENTES_LOCALIZACOES_SEED.forEach(c=>{
    const city = c.cidade ? `${c.cidade}/${c.uf||''}`.replace(/\/$/,'') : '';
    const exists=db.clientes.some(x=>
      normalizeText(x.nome)===normalizeText(c.nome) &&
      normalizeText(x.cidade)===normalizeText(city) &&
      normalizeText(x.observacoes)===normalizeText(c.observacoes)
    );
    if(!exists) db.clientes.push({
      id:crypto.randomUUID(),
      nome:c.nome||'',
      cidade:city,
      uf:c.uf||'',
      contato:'',
      cnpj:'',
      localizacao:'',
      telefone:'',
      email:'',
      observacoes:c.observacoes||''
    });
  });
  localStorage.setItem('DRO_CARGAS_V8_CLIENTES_LOCALIZACOES_OK','1');
  save();
}

function sourceList(kind){
  if(kind==='cidades')return uniqueList([...CIDADES_BASE,...learnedList('cidades')]);
  if(kind==='clientes')return uniqueList([...CLIENTES_BASE,...learnedList('clientes')]);
  if(kind==='produtos')return uniqueList([...PRODUTOS_BASE,...learnedList('produtos')]);
  if(kind==='caminhoes')return uniqueList([...CAMINHOES_BASE,...learnedList('caminhoes')]);
  return [];
}
function smartWrap(id,label,value,kind){
  return `<div class="field smartField"><label>${label}</label><input id="${id}" value="${value||''}" autocomplete="off" data-smart="${kind}" oninput="showSmartList(this)" onfocus="showSmartList(this)"><div class="smartList" id="smart_${id}"></div></div>`
}
function showSmartList(input){
  const list=document.getElementById('smart_'+input.id); if(!list)return;
  const q=normalizeText(input.value);
  const data=sourceList(input.dataset.smart);
  const found=data.filter(x=>!q||normalizeText(x).includes(q)).slice(0,40);
  list.innerHTML=found.map(x=>`<div class="smartItem" onclick="selectSmart('${input.id}',${JSON.stringify(x).replace(/"/g,'&quot;')})">${x}</div>`).join('');
  list.style.display=found.length?'block':'none';
}
function selectSmart(id,value){
  const input=document.getElementById(id); if(!input)return;
  input.value=value;
  const list=document.getElementById('smart_'+id); if(list)list.style.display='none';
  input.dispatchEvent(new Event('change'));
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.smartField')){
    document.querySelectorAll('.smartList').forEach(l=>l.style.display='none');
  }
});

function openCarga(id){

${smartWrap('cliente','Tomador do Frete',c.cliente||c.tomadorFrete||'','clientes')}
${smartWrap('origem','Origem',c.origem||'','cidades')}

function calcMot(){let ve=Number(document.getElementById('valorEmpresa')?.value||0), mg=Number(document.getElementById('margem')?.value||0); let el=document.getElementById('valorMotorista'); if(el)el.value=currency(ve*(1-mg/100))}
function saveCarga(id){let c=id?db.cargas.find(x=>x.id===id):{id:crypto.randomUUID(),op:document.getElementById('op').value||nextOp(),createdAt:Date.now()}; Object.assign(c,{op:document.getElementById('op').value||c.op||nextOp(),cliente:cliente.value,tomadorFrete:cliente.value,origem:origem.value,destino:destino.value,clienteOrigem:clienteOrigem.value,localDescarga:localDescarga.value,produto:produto.value,quantidade:quantidade.value,valorEmpresa:Number(valorEmpresa.value||0),margem:Number(margem.value||10),valorMotorista:Number(valorEmpresa.value||0)*(1-Number(margem.value||10)/100),data:data.value||today(),tipoVeiculo:tipoVeiculo.value,status:status.value,obs:obs.value}); if(!id){db.cargas.push(c); recordCotacao(c)} addHist(c.id,id?'Carga editada':'Carga criada'); closeModal(); render()}
function delCarga(id){if(confirm('Excluir carga?')){db.cargas=db.cargas.filter(c=>c.id!==id);db.agendamentos=db.agendamentos.filter(a=>a.cargaId!==id);render()}}

function saveManifesto(id){
  let f=db.manifestos.find(x=>x.id===id); if(!f)return;
  const get=k=>!!document.getElementById(`mf_${id}_${k}`)?.checked;
  let novo={manifestado:get('manifestado'),carregado:get('carregado'),transito:get('transito'),finalizado:get('finalizado')};
  if(novo.finalizado && !novo.transito){alert('Para finalizar, marque primeiro Em trânsito.'); return;}
  if(novo.transito && !novo.carregado){alert('Para marcar Em trânsito, marque primeiro Carregado.'); return;}
  if(novo.carregado && !novo.manifestado){alert('Para marcar Carregado, marque primeiro Manifestado.'); return;}
  if(!novo.manifestado){novo.carregado=false; novo.transito=false; novo.finalizado=false;}
  if(!novo.carregado){novo.transito=false; novo.finalizado=false;}
  if(!novo.transito){novo.finalizado=false;}
  f.agendado=true; f.manifestado=novo.manifestado; f.carregado=novo.carregado; f.transito=novo.transito; f.finalizado=novo.finalizado;
  let c=db.cargas.find(x=>x.id===f.cargaId);
  if(c){
    if(f.finalizado)c.status='Finalizado';
    else if(f.transito)c.status='Em trânsito';
    else if(f.carregado)c.status='Carregado';
    else if(f.manifestado)c.status='Manifestado';
    else c.status='Agendado';
    addHist(c.id,'Manifesto salvo: '+c.status);
  }
  normalize(); save(); alert('Manifesto salvo.'); render();
}

let impList=[];

function normalizeTextBasic(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();}
function cleanOCR(s){
  return String(s||'')
    .replace(/\r/g,'\n')
    .replace(/[|]+/g,'\n')
    .replace(/—|–/g,' → ')
    .replace(/\bCOTR1SAL\b/gi,'COTRISAL')
    .replace(/\bAGROFELAUGUSTO\b/gi,'AGROFEL AUGUSTO')
    .replace(/AGROFEL([A-ZÁÉÍÓÚÃÕÇ])/g,'AGROFEL $1')
    .replace(/COTRISAL([A-ZÁÉÍÓÚÃÕÇ])/g,'COTRISAL $1')
    .replace(/OLEOPLAN([A-ZÁÉÍÓÚÃÕÇ])/g,'OLEOPLAN $1')
    .replace(/BOCCHI([A-ZÁÉÍÓÚÃÕÇ])/g,'BOCCHI $1')
    .replace(/SOJA\s*A?\s*GRANEL|SOJAAGRANEL/gi,'SOJA A GRANEL')
    .replace(/SOJA\s*BENEFICIADA/gi,'SOJA BENEFICIADA')
    .replace(/FARELO\s*DE\s*SOJA|FARELEDESOJA|FARELODESOJA/gi,'FARELO DE SOJA')
    .replace(/PORTO\s*RIO\s*GRANDE|PORTORIOGRANDE/gi,'PORTO RIO GRANDE')
    .replace(/RIOGRANDE/gi,'RIO GRANDE')
    .replace(/CAPA[OD]O\s*DO\s*LEAO|CAPADDOLEAO|CAPAO\s*DO\s*LEAO/gi,'CAPAO DO LEAO')
    .replace(/STO\.?\s*EXPEDITO/gi,'STO. EXPEDITO')
    .replace(/\s+/g,' ')
    .trim();
}
function titleCaseFrete(s){return String(s||'').replace(/\s+/g,' ').trim().toUpperCase();}
function numBR(v){let s=String(v||'').replace(/[^0-9,\.]/g,''); if(!s)return 0; if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(','))s=s.replace(',','.'); return Number(s)||0}
function extractProduct(t){let m=String(t||'').match(/\b(SOJA\s+A\s+GRANEL|SOJA\s+BENEFICIADA(?:\s*-?\s*FIXO)?|FARELO\s+DE\s+SOJA(?:\s+PRO\s*45,?5\s*MI?)?|FARELO|MILHO|TRIGO|ARROZ|DDG|UREIA|FERTILIZANTE|CALC[ÁA]RIO)\b/i); return m?titleCaseFrete(m[1].replace(/\s*-\s*FIXO/i,' - FIXO')):''}
function extractVehicle(t){let m=String(t||'').match(/\b(SOMENTE\s+)?(\d+\s*EIXOS?|LS|BITREM|RODOTREM|TRUCK|GRANELEIRO|BASCULANTE|CA[CÇ]AMBA)\b/i); return m?titleCaseFrete(m[0].replace(/^SOMENTE\s+/i,'')):''}
function extractValue(t){let m=String(t||'').match(/R\$\s*([0-9.]+,?\d{0,2})/i) || String(t||'').match(/\b([0-9]{2,4},\d{2})\b/); return m?numBR(m[1]):0}
function findKnownCompany(t){let raw=normalizeTextBasic(t); let known=['AGROFEL','COTRISAL','CARGILL','BUNGE','LDC','OLEOPLAN','COFCO','BOCCHI','BIANCHINI','MOINHO NORDESTE','CAMIL','ADM','GRANJA PINHEIROS']; return known.find(k=>raw.includes(k))||'';}
function validRoutePart(s){s=cleanOCR(s); return s && !/^(RODO|BR|CN|MODAL|DATA|COTA|OP|PRODUTO|FRETE|TURNO|AS|DISP|USO)$/i.test(s);}
function splitRouteWhats(line){
  let routeLine=cleanOCR(line).replace(/\s+X\s+/i,' x ');
  let parts=routeLine.split(/\s+x\s+|\s*→\s*/i);
  if(parts.length<2)parts=routeLine.split(/\s+-\s+(?=[A-ZÁÉÍÓÚÃÕÇ].*\/RS|[A-ZÁÉÍÓÚÃÕÇ].*\/PR|[A-ZÁÉÍÓÚÃÕÇ].*\/SC)/i);
  if(parts.length>=2)return [cleanOCR(parts[0]), cleanOCR(parts.slice(1).join(' '))];
  return ['',''];
}
function parseWhatsapp(t){
  let raw=cleanOCR(t), lines=String(t||'').split(/\n+/).map(x=>cleanOCR(x)).filter(Boolean);
  let value=extractValue(raw), product=extractProduct(raw), vehicle=extractVehicle(raw);
  let routeLine=lines.find(l=>/(\/RS|\/PR|\/SC|\/SP|\/GO|\/MT|\/MS).*(\sx\s|→|\s-\s).*(\/RS|\/PR|\/SC|\/SP|\/GO|\/MT|\/MS)/i.test(l)) || lines.find(l=>/\sx\s|→/.test(l)) || raw;
  let [origem,destino]=splitRouteWhats(routeLine);
  if(!origem||!destino){
    let pin=lines.findIndex(l=>/📍|ORIGEM/i.test(l));
    let flag=lines.findIndex(l=>/🏁|DESTINO/i.test(l));
    if(pin>=0)origem=cleanOCR(lines[pin].replace(/📍|ORIGEM:?/ig,''));
    if(flag>=0)destino=cleanOCR(lines[flag].replace(/🏁|DESTINO:?/ig,''));
  }
  let cliente=findKnownCompany(raw);
  return {cliente,origem,destino,produto:product,quantidade:'',valorEmpresa:value,margem:Number(document.getElementById('impMarg')?.value||10),valorMotorista:value*(1-Number(document.getElementById('impMarg')?.value||10)/100),data:today(),tipoVeiculo:vehicle,status:'Disponível',obs:''};
}
function tableSegments(t){
  let raw=String(t||'').replace(/\r/g,'\n');
  let byLine=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let rows=byLine.filter(l=>/\bRODO\b/i.test(l)&&/\b(SOJA|FARELO|MILHO|TRIGO|ARROZ)\b/i.test(l));
  if(rows.length>=2)return rows;
  let compact=raw.replace(/\n/g,' ').replace(/\s+/g,' ');
  let parts=compact.split(/(?=\b(?:aa\s+|\d+\s+|BR\s+)?RODO\s+\d{3,6}\b)/i).map(x=>x.trim()).filter(x=>/\bRODO\s+\d{3,6}\b/i.test(x));
  return parts;
}
function splitColumnsPreserve(seg){
  let line=String(seg||'').replace(/\t/g,'    ').replace(/\r/g,' ').trim();
  let cols=line.split(/\s{2,}/).map(cleanOCR).filter(Boolean);
  if(cols.length>=8)return cols;
  return [];
}
function parseTableByColumns(seg){
  let cols=splitColumnsPreserve(seg); if(!cols.length)return null;
  let idx=cols.findIndex(c=>/^RODO$/i.test(c)||/RODO\s+\d/i.test(c));
  let cnIdx=cols.findIndex(c=>/^\d{3,6}(\s*\(?\d+\)?)?$/.test(c));
  let start = idx>=0 ? idx+2 : (cnIdx>=0?cnIdx+1:0);
  // Remove colunas iniciais de ícones/data/modal/cn quando existirem
  let fields=cols.slice(start);
  if(fields.length<5)return null;
  let productIndex=fields.findIndex(f=>extractProduct(f));
  if(productIndex<4)return null;
  let value=0;
  let valCol=fields[productIndex+1]||'';
  if(/\b\d{2,4}\b/.test(valCol))value=Number((valCol.match(/\b(\d{2,4})\b/)||[])[1])||0;
  return buildCarga(fields[0], fields[2], fields[3], extractProduct(fields[productIndex]), value, '');
}
function buildCarga(cliente,origem,destino,produto,valor,veiculo){
  let mg=Number(document.getElementById('impMarg')?.value||10), ve=Number(valor||0);
  return {cliente:titleCaseFrete(cliente),origem:titleCaseFrete(origem),destino:titleCaseFrete(destino),produto:titleCaseFrete(produto),quantidade:'',valorEmpresa:ve,margem:mg,valorMotorista:ve*(1-mg/100),data:today(),tipoVeiculo:titleCaseFrete(veiculo||''),status:'Disponível',obs:''};
}
function tokenizePlaces(s){
  s=cleanOCR(s);
  const prefixes=['AGROFEL','BOCCHI','COTRISAL','ILTON SCHIO BALZAN','GRANJA PINHEIROS-GRAO PARA','GRANJA PINHEIROS','JONATAN CEREZER BULIGON','MAURICIO SILVEIRA COSTA','TRES TENTOS-VACARIA','JOCELITO BOEIRA RODRIGUES','RIO PARDO - GRANELEIRA','PORTO RIO GRANDE - RS','PORTO RIO GRANDE','BIANCHINI-RIO GRANDE','CAPAO DO LEAO'];
  let found=[];
  for(const p of prefixes){let re=new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m; while((m=re.exec(s)))found.push({p:cleanOCR(m[0]),i:m.index});}
  found.sort((a,b)=>a.i-b.i);
  // cria blocos iniciando em prefixos conhecidos
  let blocks=[];
  for(let i=0;i<found.length;i++){
    let a=found[i], b=found[i+1];
    let txt=s.slice(a.i,b?b.i:undefined).trim();
    if(txt && !blocks.includes(txt))blocks.push(txt);
  }
  return blocks.map(cleanOCR).filter(validRoutePart);
}
function parseTableLine(seg){
  let byCols=parseTableByColumns(seg); if(byCols && isStrongUseful(byCols))return byCols;
  let s=cleanOCR(seg);
  let product=extractProduct(s);
  let value=0;
  if(product){
    let pEsc=product.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    let m=s.match(new RegExp(pEsc+'\\s+(?:PRO\\s*45,?5\\s*MI\\s*)?(\\d{2,4})\\b','i'));
    if(m)value=Number(m[1])||0;
  }
  if(!value){let nums=[...s.matchAll(/\b(\d{2,4})(?=\s*(?:07:|08:|19:|AS|$))/gi)].map(m=>Number(m[1])).filter(n=>n>=20&&n<=999); if(nums.length)value=nums[0];}
  let beforeProduct=product?s.split(new RegExp(product.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'),'i'))[0]:s;
  let afterRodo=(beforeProduct.match(/\bRODO\s+\d{3,6}\s*(?:\(?\s*\d{4,6}\s*\)?)?\s+(.+)/i)||[])[1]||beforeProduct;
  afterRodo=afterRodo.replace(/^\d{1,2}\s+/,'').replace(/^BR\s+/i,'');
  let blocks=tokenizePlaces(afterRodo);
  let cliente='', origem='', destino='';
  if(blocks.length>=4){cliente=blocks[0]; origem=blocks[blocks.length-2]; destino=blocks[blocks.length-1];}
  else if(blocks.length===3){cliente=blocks[0]; origem=blocks[1]; destino=blocks[2];}
  else if(blocks.length===2){origem=blocks[0]; destino=blocks[1]; cliente=findKnownCompany(s);}
  else {cliente=findKnownCompany(s);}
  // destinos comuns no fim do registro
  let destMatch=s.match(/\b(PORTO RIO GRANDE\s*-\s*RS|BIANCHINI\s*-?\s*RIO GRANDE|GRANJA PINHEIROS\s*-?\s*GRAO PARA|AGROFEL\s+CAPAO DO LEAO|BOCCHI\s*-?\s*MUITOS CAPOES)\b/i);
  if(destMatch)destino=cleanOCR(destMatch[1]);
  if(!origem && blocks.length>=2)origem=blocks[blocks.length-2];
  return buildCarga(cliente,origem,destino,product,value,'');
}
function isStrongUseful(c){return !!((c.origem&&c.destino) || (c.produto&&c.valorEmpresa) || (c.cliente&&c.produto&&c.destino));}
function isUseful(c){return isStrongUseful(c) || !!(c.origem||c.destino||c.produto||c.valorEmpresa||c.cliente)}
function parseImportAll(t){
  let text=String(t||'');
  let segs=tableSegments(text);
  let out=[];
  if(segs.length>=2 || (segs.length===1 && /\bRODO\b/i.test(text))){
    out=segs.map(parseTableLine).filter(isStrongUseful);
  } else {
    out=[parseWhatsapp(text)].filter(isUseful);
  }
  if(!out.length && text.trim())out=[parseWhatsapp(text)].filter(isUseful);
  return out;
}
function previewImport(){
  let txt=document.getElementById('impText')?.value||'';

function pdfSafeText(v){return String(v??'').replace(/[\u2013\u2014]/g,'-').replace(/\s+/g,' ').trim();}
function pdfText(doc,txt,x,y,opt={}){
  txt=pdfSafeText(txt);
  const max=opt.max||0;
  if(max && doc.getTextWidth(txt)>max){
    while(txt.length>3 && doc.getTextWidth(txt+'...')>max) txt=txt.slice(0,-1);
    txt+='...';
  }
  doc.text(txt,x,y,opt);
}
function pdfCell(doc,x,y,w,h,txt,opt={}){
  if(opt.fill){doc.setFillColor(217,217,217); doc.rect(x,y,w,h,'FD');}
  else doc.rect(x,y,w,h);
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica',opt.bold?'bold':'normal');
  doc.setFontSize(opt.size||7);
  let text=pdfSafeText(txt);
  let lines=String(txt??'').split(/\n+/).map(pdfSafeText).filter(Boolean);
  if(lines.length>1){
    const fs=opt.size||7; doc.setFontSize(fs);
    const lineH=Math.max(3,fs*0.42);
    let startY=y+h/2-((lines.length-1)*lineH)/2+1.3;
    lines.forEach((ln,i)=>{
      if(opt.center)pdfText(doc,ln,x+w/2,startY+i*lineH,{align:'center',max:w-3});
      else pdfText(doc,ln,x+1.5,startY+i*lineH,{max:w-3});
    });
    return;
  }
  let tx=x+1.5, ty=y+h/2+2;
  if(opt.center){pdfText(doc,text,x+w/2,ty,{align:'center',max:w-3});}
  else if(opt.right){pdfText(doc,text,x+w-1.5,ty,{align:'right',max:w-3});}
  else pdfText(doc,text,tx,ty,{max:w-3});
}

function escapeHtml(v){return String(v??'').replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function niceLabel(f){return ({nome:'Nome',nomeWhatsapp:'Nome no WhatsApp',cidade:'Cidade',municipio:'Município',uf:'UF',contato:'Contato',cnpj:'CNPJ',localizacao:'Localização (link)',telefone:'Telefone',email:'E-mail',observacoes:'Observações',placa:'Placa',placaCavalo:'Placa Cavalo',placaCarreta:'Placa Carreta / S. Reb.',tipo:'Tipo',motorista:'Motorista',situacao:'Situação',tipoVeiculo:'Tipo veículo',titulo:'Título',descricao:'Descrição',data:'Data',cpf:'CPF',rg:'RG',cnh:'CNH',veiculoId:'Veículo vinculado',proprietario:'Proprietário',cpfCnpjProprietario:'CPF/CNPJ Proprietário',rntrc:'RNTRC'}[f]||f)}

function simpleInputField(f,item){
  const value = escapeHtml(item[f]||'');
  const label = niceLabel(f);
  const smartKind = (f==='cidade'||f==='municipio') ? 'cidades' : (f==='nome' ? 'clientes' : '');
  if(f==='observacoes'||f==='descricao'){
    return `<div class="field span2"><label>${label}</label><textarea id="s_${f}">${value}</textarea></div>`;
  }
  if(f==='localizacao'){
    return `<div class="field span2"><label>${label}</label><input id="s_${f}" value="${value}" placeholder="Cole o link do Google Maps, se tiver"></div>`;
  }
  if(f==='veiculoId'){
    return `<div class="field"><label>${label}</label><select id="s_${f}"><option value="">Selecionar...</option>${(db.veiculos||[]).map(v=>`<option value="${v.id}" ${item[f]===v.id?'selected':''}>${escapeHtml((v.placaCavalo||v.placa||'')+' '+(v.placaCarreta||''))}</option>`).join('')}</select></div>`;
  }
  if(smartKind){
    return `<div class="field smartField"><label>${label}</label><input id="s_${f}" value="${value}" autocomplete="off" data-smart="${smartKind}" oninput="showSmartList(this)" onfocus="showSmartList(this)"><div class="smartList" id="smart_s_${f}"></div></div>`;
  }
  return `<div class="field"><label>${label}</label><input id="s_${f}" value="${value}"></div>`;
}


const SIMPLE_FIELDS={
  clientes:['nome','cidade','uf','contato','cnpj','localizacao','telefone','email','observacoes'],
  agenda:['titulo','descricao','data']
};
function openSimpleKey(key,title){
  const fields=SIMPLE_FIELDS[key]||['nome','cidade','uf','contato','cnpj','localizacao','telefone','email','observacoes'];
  openSimple(key,title,fields);
}
function editSimpleKey(key,id,title){
  const fields=SIMPLE_FIELDS[key]||['nome','cidade','uf','contato','cnpj','localizacao','telefone','email','observacoes'];
  editSimple(key,id,fields,title);
}

function simplePage(m,key,title,fields){
  SIMPLE_FIELDS[key]=fields;
  const filter=simpleFilters[key]||'';
  const q=filter.toLowerCase();
  const rows=(db[key]||[]).filter(i=>!q||fields.some(f=>String(i[f]||'').toLowerCase().includes(q))).sort((a,b)=>String(a.nome||a.placa||a.titulo||'').localeCompare(String(b.nome||b.placa||b.titulo||''),'pt-BR'));
  const filterHtml=['clientes','motoristas','veiculos'].includes(key)?`<input class="search" placeholder="Filtrar ${title.toLowerCase()}..." value="${escapeHtml(filter)}" oninput="simpleFilters['${key}']=this.value;render()">`:'';
  m.innerHTML=topHtml(title,'Cadastro')+`<div class="panel"><div class="toolbar"><div>${filterHtml}</div><button class="primary" onclick="openSimpleKey('${key}','${title}')">+ Novo</button></div><div class="tableWrap"><table class="table"><thead><tr>${fields.slice(0,6).map(f=>`<th>${niceLabel(f)}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.length?rows.map(i=>`<tr>${fields.slice(0,6).map(f=>`<td>${f==='localizacao'&&i[f]?`<a href="${i[f]}" target="_blank">Abrir Maps</a>`:escapeHtml(i[f]||'')}</td>`).join('')}<td><button class="btn small" onclick="editSimpleKey('${key}','${i.id}','${title}')">Editar</button> <button class="red small" onclick="delSimple('${key}','${i.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="7">Nenhum cadastro.</td></tr>'}</tbody></table></div></div>`
}
function openSimple(key,title,fields){openModal(`<h2>Novo ${title}</h2><div class="grid">${fields.map(f=>simpleInputField(f,{})).join('')}</div><br><button class="green" onclick="saveSimple('${key}',${JSON.stringify(fields).replaceAll('\"','&quot;')})">Salvar</button> <button class="btn" onclick="closeModal()">Fechar</button>`)}
function editSimple(key,id,fields,title){let item=db[key].find(x=>x.id===id); if(!item)return; openModal(`<h2>Editar ${title}</h2><div class="grid">${fields.map(f=>simpleInputField(f,item)).join('')}</div><br><button class="green" onclick="updateSimple('${key}','${id}',${JSON.stringify(fields).replaceAll('\"','&quot;')})">Salvar</button> <button class="btn" onclick="closeModal()">Fechar</button>`)}
function saveSimple(key,fields){let obj={id:crypto.randomUUID()}; fields.forEach(f=>obj[f]=document.getElementById('s_'+f).value); if(!db[key])db[key]=[]; db[key].push(obj); save(); closeModal(); render()}
function updateSimple(key,id,fields){let obj=db[key].find(x=>x.id===id); if(!obj)return; fields.forEach(f=>obj[f]=document.getElementById('s_'+f).value); save(); closeModal(); render()}
function delSimple(key,id){if(confirm('Excluir cadastro?')){db[key]=db[key].filter(x=>x.id!==id); save(); render()}}
function veiculoLabelById(id){let v=db.veiculos.find(x=>x.id===id); return v?`${v.placaCavalo||v.placa||''} / ${v.placaCarreta||''}`:''}
function motoristaVeiculoRows(){
  const q=(simpleFilters.motoristas||'').toLowerCase();
  return (db.motoristas||[]).map(m=>({m,v:(db.veiculos||[]).find(v=>v.id===m.veiculoId)||{}})).filter(({m,v})=>!q||JSON.stringify({m,v}).toLowerCase().includes(q));
}
function motorVeiculoPage(m){

    ${mvField('rg','RG',mot.rg)}${mvField('cnh','CNH',mot.cnh)}
    ${mvField('municipio','Município',mot.municipio||mot.cidade)}${mvField('uf','UF',mot.uf)}

function mvField(id,label,val=''){return `<div class="field"><label>${label}</label><input id="mv_${id}" value="${escapeHtml(val||'')}"></div>`}
function mvVal(id){let e=document.getElementById('mv_'+id); return e?e.value:''}
function saveMotorVeiculo(id=''){
  let mot=id?db.motoristas.find(x=>x.id===id):null;
  if(!mot){mot={id:crypto.randomUUID()}; db.motoristas.push(mot)}
  let vei=(db.veiculos||[]).find(v=>v.id===mot.veiculoId);
  if(!vei){vei={id:crypto.randomUUID()}; db.veiculos.push(vei); mot.veiculoId=vei.id}
  Object.assign(mot,{nome:mvVal('nome'),nomeWhatsapp:mvVal('nomeWhatsapp'),telefone:mvVal('telefone'),cpf:mvVal('cpf'),rg:mvVal('rg'),cnh:mvVal('cnh'),municipio:mvVal('municipio'),uf:mvVal('uf'),placa:mvVal('placaCavalo'),observacoes:document.getElementById('mv_observacoes').value,veiculoId:vei.id});
  Object.assign(vei,{placaCavalo:mvVal('placaCavalo'),placa:mvVal('placaCavalo'),placaCarreta:mvVal('placaCarreta'),tipo:mvVal('tipo'),motorista:mvVal('nome'),proprietario:mvVal('proprietario'),cpfCnpjProprietario:mvVal('cpfCnpjProprietario'),municipio:mvVal('municipioVeiculo')||mvVal('municipio'),uf:mvVal('ufVeiculo')||mvVal('uf'),rntrc:mvVal('rntrc'),observacoes:document.getElementById('mv_observacoes').value});
  save(); closeModal(); render();
}
function delMotorVeiculo(id){if(!confirm('Excluir este cadastro de motorista e caminhão?'))return; let mot=db.motoristas.find(x=>x.id===id); if(mot&&mot.veiculoId)db.veiculos=db.veiculos.filter(v=>v.id!==mot.veiculoId); db.motoristas=db.motoristas.filter(m=>m.id!==id); save(); render()}

function cotNorm(v){
  return String(v||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[-–—>→x]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function cotContains(campo, busca){
  busca=cotNorm(busca);
  if(!busca)return true;
  const alvo=cotNorm(campo);
  return busca.split(' ').every(p=>alvo.includes(p));
}
function aplicarCotacaoFiltros(){
  window.cotIni=document.getElementById('cotIni')?.value||'';
  window.cotFim=document.getElementById('cotFim')?.value||'';
  window.cotOri=document.getElementById('cotOri')?.value||'';
  window.cotDest=document.getElementById('cotDest')?.value||'';
  window.cotProd=document.getElementById('cotProd')?.value||'';
  window.cotCli=document.getElementById('cotCli')?.value||'';
  render();
}
function limparCotacaoFiltros(){
  window.cotIni='';window.cotFim='';window.cotOri='';window.cotDest='';window.cotProd='';window.cotCli='';render();
}
function cotacaoPage(m){
  if(!db.cotacoes)db.cotacoes=[]; ensureCotacoes();
  const ini=window.cotIni||'', fim=window.cotFim||'', ori=window.cotOri||'', dest=window.cotDest||'', prod=window.cotProd||'', cli=window.cotCli||'';
  let rows=db.cotacoes.filter(c=>{
    let d=c.dataLancada||c.data||'';
    if(ini&&d<ini)return false;
    if(fim&&d>fim)return false;
    if(!cotContains(c.origem,ori))return false;
    if(!cotContains(c.destino,dest))return false;
    if(!cotContains(c.produto,prod))return false;
    if(!cotContains(c.cliente,cli))return false;
    return true;
  }).sort((a,b)=>String(b.dataLancada||'').localeCompare(String(a.dataLancada||'')));
  const vals=rows.map(r=>Number(r.valorEmpresa||0)).filter(v=>v>0);
  const media=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const min=vals.length?Math.min(...vals):0, max=vals.length?Math.max(...vals):0;
  m.innerHTML=topHtml('Cotação','Histórico de fretes lançados, mesmo que a carga seja excluída')+`
  <div class="cards"><div class="card">Média<b>${currency(media)}</b></div><div class="card">Menor<b>${currency(min)}</b></div><div class="card">Maior<b>${currency(max)}</b></div><div class="card">Registros<b>${rows.length}</b></div></div>
  <div class="panel"><h2>Filtros</h2><div class="grid">
    <div class="field"><label>Data inicial</label><input id="cotIni" type="date" value="${escapeHtml(ini)}"></div>
    <div class="field"><label>Data final</label><input id="cotFim" type="date" value="${escapeHtml(fim)}"></div>
    <div class="field"><label>Origem</label><input id="cotOri" placeholder="Ex: Cruz Alta" value="${escapeHtml(ori)}" onkeydown="if(event.key==='Enter')aplicarCotacaoFiltros()"></div>
    <div class="field"><label>Destino</label><input id="cotDest" placeholder="Ex: Rio Grande" value="${escapeHtml(dest)}" onkeydown="if(event.key==='Enter')aplicarCotacaoFiltros()"></div>
    <div class="field"><label>Produto</label><input id="cotProd" value="${escapeHtml(prod)}" onkeydown="if(event.key==='Enter')aplicarCotacaoFiltros()"></div>
    <div class="field"><label>Cliente</label><input id="cotCli" value="${escapeHtml(cli)}" onkeydown="if(event.key==='Enter')aplicarCotacaoFiltros()"></div>
  </div><br><button class="primary" onclick="aplicarCotacaoFiltros()">Aplicar filtros</button> <button class="btn" onclick="limparCotacaoFiltros()">Limpar filtros</button><p class="sub" style="margin-top:10px">Agora o filtro só aplica quando clicar em <b>Aplicar filtros</b> ou apertar Enter. Assim você consegue digitar normalmente.</p></div>
  <div class="panel"><div class="tableWrap"><table class="table"><thead><tr><th>Data lançada</th><th>Origem</th><th>Destino</th><th>Produto</th><th>Cliente</th><th>Valor empresa</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${dateBR(r.dataLancada)}</td><td>${escapeHtml(r.origem||'')}</td><td>${escapeHtml(r.destino||'')}</td><td>${escapeHtml(r.produto||'')}</td><td>${escapeHtml(r.cliente||'')}</td><td><b>${currency(r.valorEmpresa)}</b></td></tr>`).join(''):'<tr><td colspan="6">Nenhuma cotação encontrada.</td></tr>'}</tbody></table></div></div>`
}

let placasAgendadas=uniqueList((db.agendamentos||[]).map(a=>a.placa)).length;

</div>`;
}
function addHist(cargaId,txt){db.historico.push({id:crypto.randomUUID(),cargaId,txt,data:today(),hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})})}
function backup(){let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})); a.download='backup-dro-cargas.json'; a.click()}
function restoreBackup(e){let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{db=Object.assign(defaultDb(),JSON.parse(r.result)); normalize(); save(); alert('Backup restaurado.'); render()}catch(err){alert('Arquivo inválido')}}; r.readAsText(f)}
