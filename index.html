<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>DRO Cargas V11</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
    <h2>DRO Cargas</h2>
    <table id="tabela-cargas" border="1">
        <thead><tr><th>OP (CN)</th><th>Destino</th><th>Origem</th><th>Status</th></tr></thead>
        <tbody></tbody>
    </table>

    <script>
        const config = { databaseURL: "https://dro-cargas-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(config);

        firebase.database().ref('cargas').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.querySelector('#tabela-cargas tbody');
            tbody.innerHTML = '';
            
            if (data) {
                Object.values(data).forEach(c => {
                    tbody.innerHTML += `<tr>
                        <td>${c.cn || ''}</td>
                        <td>${c.destino || ''}</td>
                        <td>${c.origem || ''}</td>
                        <td>${c.disponivel ? 'Disponível' : 'Indisponível'}</td>
                    </tr>`;
                });
            }
        });
    </script>
</body>
</html>
