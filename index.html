<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>DRO Cargas V18</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { background: #040b14; color: #f4f7fe; font-family: sans-serif; margin: 0; padding: 20px; }
        .nav-bar { margin-bottom: 20px; }
        .tab-content { display: none; }
        .active { display: block; }
        button { background: #2d8cff; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; margin-right: 5px; }
        table { width: 100%; border-collapse: collapse; background: #0d1728; margin-top: 10px; }
        th, td { padding: 8px; border-bottom: 1px solid #23374f; font-size: 12px; text-align: left; }
        .btn-acao { font-size: 11px; padding: 4px 8px; background: #23374f; cursor: pointer; color: white; border: none; border-radius: 3px; margin: 2px; }
        textarea { width: 100%; height: 200px; background: #0d1728; color: white; border: 1px solid #23374f; padding: 10px; }
        .input-busca { width: 100%; padding: 8px; margin-bottom: 10px; background: #0d1728; border: 1px solid #23374f; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button onclick="trocarTab('cargas')">Cargas</button>
        <button onclick="trocarTab('motoristas')">Motoristas</button>
        <button onclick="trocarTab('agenda')">Agenda</button>
    </div>

    <!-- ABA CARGAS -->
    <div id="cargas" class="tab-content active">
        <h2>Cargas</h2>
        <input type="text" id="buscaCargas" class="input-busca" placeholder="Buscar cargas...">
        <button>+ Nova Carga</button>
        <table>
            <thead>
                <tr>
                    <th></th><th>OP</th><th>Origem</th><th>Destino</th><th>Produto</th>
                    <th>Vlr Empresa</th><th>Vlr Mot</th><th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-cargas"></tbody>
        </table>
    </div>

    <!-- ABA MOTORISTAS -->
    <div id="motoristas" class="tab-content">
        <h2>Motoristas</h2>
        <input type="text" id="buscaMot" class="input-busca" placeholder="Pesquisar por placa ou nome...">
        <button>+ Cadastrar Motorista</button>
        <table>
            <thead><tr><th>Cavalo</th><th>Motorista</th><th>WhatsApp</th><th>Ações</th></tr></thead>
            <tbody id="lista-motoristas"></tbody>
        </table>
    </div>

    <!-- ABA AGENDA -->
    <div id="agenda" class="tab-content">
        <h2>Agenda / Notas</h2>
        <textarea id="notas"></textarea>
    </div>

    <script>
        const config = { databaseURL: "https://dro-cargas-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(config);

        function trocarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
        }

        firebase.database().ref('cargas').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('lista-cargas');
            tbody.innerHTML = "";
            for (let id in data) {
                let c = data[id];
                let valEmpresa = parseFloat(c.valor || 0);
                let perc = parseFloat(c.percentual || 10);
                let valMot = (valEmpresa * (perc / 100)).toFixed(2);
                
                tbody.innerHTML += `<tr>
                    <td>${c.origem_cadastro === 'robo' ? '🤖' : '👤'}</td>
                    <td>${c.cn||''}</td>
                    <td>${c.cidadeOrigem||''}</td>
                    <td>${c.cidadeDestino||''}</td>
                    <td>${c.produto||''}</td>
                    <td>R$ ${valEmpresa.toFixed(2)}</td>
                    <td>R$ ${valMot}</td>
                    <td>
                        <button class="btn-acao">Ordem</button>
                        <button class="btn-acao">Editar</button>
                    </td>
                </tr>`;
            }
        });
    </script>
</body>
</html>
