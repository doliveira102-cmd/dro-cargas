<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>DRO Cargas V14</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { background: #040b14; color: #f4f7fe; font-family: sans-serif; margin: 0; padding: 20px; }
        .nav-bar { margin-bottom: 20px; }
        .tab-content { display: none; }
        .active { display: block; }
        button { background: #2d8cff; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #0d1728; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #23374f; font-size: 13px; text-align: left; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #0d1728; padding: 20px; border-radius: 8px; width: 450px; max-height: 90vh; overflow-y: auto; border: 1px solid #2d8cff; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; background: #040b14; color: white; border: 1px solid #23374f; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button onclick="trocarTab('cargas')">Cargas</button>
        <button onclick="trocarTab('motoristas')">Motoristas</button>
        <button onclick="trocarTab('agenda')">Agenda</button>
    </div>

    <!-- ABA CARGAS -->
    <div id="cargas" class="tab-content active">
        <h2>Cargas</h2>
        <input type="text" id="buscaCargas" placeholder="Buscar cargas..." onkeyup="filtrarCargas()">
        <button>+ Nova Carga</button>
        <table>
            <thead><tr><th>Origem</th><th>OP</th><th>Destino</th><th>Produto</th><th>Vlr Empresa</th><th>Ações</th></tr></thead>
            <tbody id="lista-cargas"></tbody>
        </table>
    </div>

    <!-- ABA MOTORISTAS -->
    <div id="motoristas" class="tab-content">
        <h2>Motoristas</h2>
        <button onclick="abrirModalMot()">+ Cadastrar Motorista</button>
    </div>

    <!-- ABA AGENDA -->
    <div id="agenda" class="tab-content">
        <h2>Agenda de Tarefas</h2>
        <button>+ Nova Tarefa</button>
    </div>

    <script>
        const config = { databaseURL: "https://dro-cargas-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(config);

        // Carregar Cargas
        firebase.database().ref('cargas').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('lista-cargas');
            tbody.innerHTML = "";
            for (let id in data) {
                let c = data[id];
                tbody.innerHTML += `<tr>
                    <td>${c.origem_cadastro === 'robo' ? '🤖' : '👤'}</td>
                    <td>${c.cn||''}</td>
                    <td>${c.cidadeDestino||''}</td>
                    <td>${c.produto||''}</td>
                    <td>R$ ${parseFloat(c.valor||0).toFixed(2)}</td>
                    <td><button>Ordem</button></td>
                </tr>`;
            }
        });

        function trocarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
        }
    </script>
</body>
</html>
