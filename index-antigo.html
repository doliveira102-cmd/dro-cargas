<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRO Cargas v7.0 OCR por Posição</title>
<style>
:root{--nav:#08213a;--blue:#2563eb;--green:#16a34a;--red:#ef4444;--bg:#f3f7fb;--card:#fff;--line:#d8e2ef;--txt:#142033;--muted:#60708a;--amber:#f59e0b;--purple:#7c3aed;--orange:#f97316}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--txt)}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.btn{background:#e8eef7;color:#12213a}.primary{background:var(--blue);color:white}.green{background:var(--green);color:white}.red{background:var(--red);color:white}.dark{background:#071626;color:white}.ghost{background:#eef4fb}.small{padding:7px 10px;font-size:13px}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--nav);color:white;position:fixed;left:0;top:0;bottom:0;transition:.2s;z-index:5;overflow:auto}.side.closed{width:72px}.brand{height:82px;display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid rgba(255,255,255,.12);position:relative}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2f80ed,#1aa286);display:grid;place-items:center;font-weight:900}.brand span{font-weight:900;font-size:20px;white-space:nowrap}.toggle{margin-left:auto;background:#29415e;color:white;border-radius:10px;padding:8px 10px;min-width:38px;z-index:9}.side.closed .toggle{position:absolute;right:-17px;top:23px;border:2px solid #fff;border-radius:50%;width:36px;height:36px;padding:0;background:#29415e;display:grid;place-items:center}.side:not(.closed) .toggle{display:block}.side.closed .brand span,.side.closed .label{display:none}.nav a{display:flex;align-items:center;gap:14px;margin:8px 10px;padding:12px 13px;border-radius:10px;color:white;text-decoration:none}.nav a.active,.nav a:hover{background:#173d63}.ico{font-size:20px;width:22px;text-align:center}.main{margin-left:250px;transition:.2s;width:calc(100% - 250px);padding:28px 32px}.side.closed+.main{margin-left:72px;width:calc(100% - 72px)}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin:4px 0 24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(15,36,67,.06);cursor:pointer}.card b{font-size:34px;display:block;margin-top:8px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:0 10px 28px rgba(15,36,67,.06)}.panel h2{margin:0 0 12px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.search{max-width:330px;width:100%;padding:13px;border:1px solid var(--line);border-radius:11px}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table th{background:#f8fbff;text-align:left;color:#30435f;font-size:13px;text-transform:uppercase}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#f8fbff}.route{font-weight:900}.money{display:inline-block;background:#eef4ff;padding:7px 10px;border-radius:10px;font-weight:900;margin:2px}.margin{background:#fff3e6}.status{display:inline-block;padding:7px 11px;border-radius:999px;font-weight:900;font-size:13px}.Disponivel{background:#dbeafe;color:#1d4ed8}.Agendado{background:#fef3c7;color:#92400e}.Manifestado{background:#ede9fe;color:#5b21b6}.Carregado{background:#dcfce7;color:#166534}.Transito{background:#ffedd5;color:#9a3412}.Finalizado{background:#dcfce7;color:#166534}.actionsRow{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:22px}.modal.show{display:flex}.box{background:white;border-radius:18px;padding:22px;max-width:900px;width:100%;max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;color:#53637a;font-weight:800;margin:0 0 4px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white}.field textarea{min-height:80px}.span2{grid-column:1/-1}.readonly{background:#f8fbff;border:1px solid var(--line);border-radius:12px;padding:13px}.readonly small{display:block;color:#60708a}.readonly b{display:block;margin-top:3px}.steps{display:flex;gap:10px;flex-wrap:wrap}.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fbff}.step input{margin-right:7px}.notice{padding:12px;border-radius:12px;background:#fff7ed;border:1px solid #fdba74;color:#9a3412}.drop{border:2px dashed #9bb5d6;border-radius:14px;padding:18px;text-align:center;background:#f8fbff;min-height:160px}.drop img{max-width:100%;max-height:170px}.ad{white-space:pre-wrap;background:#f8fbff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.hidden{display:none}.tableWrap{width:100%;overflow-x:auto}.manifest-table{min-width:1120px}.manifest-table th,.manifest-table td{white-space:nowrap;padding:10px 8px}.manifest-table .step{display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;min-width:124px;padding:8px 10px;margin:0}.manifest-table .step input{margin:0}.manifest-table .search{max-width:none;width:100%;min-width:105px;padding:8px}.manifest-save{min-width:78px}.login-note{font-size:12px;color:#60708a}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.side{width:72px}.side .brand span,.side .label{display:none}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.top{flex-direction:column}.table{font-size:13px}.table th,.table td{padding:9px}.actionsRow button{padding:7px 9px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="modal" style="display:none"><div class="box" style="max-width:420px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:18px"><div class="logo">DRO</div><div><h1 style="font-size:28px">DRO Cargas</h1><div class="sub" style="margin:0">Gestão inteligente de fretes</div></div></div><div class="field"><label>E-mail</label><input id="email" value="diego@drocargas.com"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="senha" type="password" value="123456"></div><button class="green" style="width:100%;margin-top:16px" onclick="login()">Entrar</button><p class="sub">Login inicial: diego@drocargas.com / 123456</p></div></div>
<div class="app"><aside id="side" class="side closed"><div class="brand"><div class="logo">DRO</div><span>DRO Cargas<br><small>v7.0 OCR Posição</small></span><button class="toggle" onclick="toggleSide()">▶</button></div><nav class="nav" id="nav"></nav></aside><main class="main" id="main"></main></div>
<div id="modal" class="modal"><div class="box" id="modalBox"></div></div>
<input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY='DRO_CARGAS_DATA'; const MASTER='DRO_CARGAS_MASTER'; const OLD=['DRO_CARGAS_MASTER','DRO_CARGAS_DATA','droCargasData','DRO_CARGAS_V19','DRO_CARGAS_V20','dro-cargas'];
let page='dashboard', search='', editId=null; let simpleFilters={clientes:'',motoristas:'',veiculos:''}; let manFilter={motorista:'',placa:'',agendado:'',manifestado:'',carregado:'',transito:'',finalizado:''};
let db=load();
const pages=[['dashboard','🏠','Dashboard'],['rascunhos','📝','Rascunhos'],['agenda','🗓️','Agenda'],['cargas','🚛','Cargas'],['importar','📥','Importação Inteligente'],['agendamentos','📋','Agendamentos'],['manifestos','📄','Manifestos'],['clientes','👥','Clientes'],['motoristas','👤','Motoristas'],['veiculos','🚚','Veículos'],['anuncios','📣','Anúncios'],['relatorios','📊','Relatórios']];
function defaultDb(){return{cargas:[],agendamentos:[],manifestos:[],clientes:[],motoristas:[],veiculos:[],anuncios:[],agenda:[],historico:[],rascunho:'',lastOp:0,version:'4.0'}}
function load(){let d=null; for(const k of OLD){let o=localStorage.getItem(k); if(o){d=o; break}} try{let x=d?JSON.parse(d):defaultDb(); return Object.assign(defaultDb(),x)}catch(e){return defaultDb()}}
function save(){const payload=JSON.stringify(db); localStorage.setItem(KEY,payload); localStorage.setItem(MASTER,payload); try{localStorage.setItem('DRO_CARGAS_V35_ULTIMO',payload)}catch(e){}}
function login(){const e=document.getElementById('email').value.trim(); const s=document.getElementById('senha').value.trim(); if(e!=='diego@drocargas.com'||s!=='123456'){alert('E-mail ou senha incorretos.'); return;} sessionStorage.setItem('DRO_CARGAS_SESSAO','1');document.getElementById('login').classList.remove('show');document.getElementById('login').style.display='none'; page='dashboard'; render()}
function logout(){sessionStorage.removeItem('DRO_CARGAS_SESSAO'); document.getElementById('login').style.display='flex'; document.getElementById('login').classList.add('show');}
function toggleSide(){let s=document.getElementById('side'); s.classList.toggle('closed'); s.querySelector('.toggle').textContent=s.classList.contains('closed')?'▶':'◀'}
function go(p){page=p; search=''; render()}
function renderNav(){document.getElementById('nav').innerHTML=pages.map(p=>`<a title="${p[2]}" class="${page==p[0]?'active':''}" onclick="go('${p[0]}')"><span class="ico">${p[1]}</span><span class="label">${p[2]}</span></a>`).join('')}
function render(){normalize(); save(); renderNav(); const m=document.getElementById('main'); const title=pages.find(x=>x[0]==page)?.[2]||''; if(page==='dashboard') return dashboard(m); if(page==='rascunhos') return rascunhosPage(m); if(page==='cargas') return cargasPage(m); if(page==='agendamentos') return agPage(m); if(page==='manifestos') return manPage(m); if(page==='anuncios') return adsPage(m); if(page==='pendencias') return pendPage(m); if(page==='importar') return importPage(m); if(page==='clientes') return simplePage(m,'clientes','Clientes',['nome','cidade','uf','contato','cnpj','localizacao','telefone','email','observacoes']); if(page==='motoristas') return simplePage(m,'motoristas','Motoristas',['nome','telefone','placa','cidade','tipoVeiculo','observacoes']); if(page==='veiculos') return simplePage(m,'veiculos','Veículos',['placa','tipo','motorista','cidade','situacao']); if(page==='agenda') return simplePage(m,'agenda','Agenda',['titulo','descricao','data']); if(page==='relatorios') return reports(m);}
function topHtml(title,sub='Resumo operacional do DRO Cargas'){return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions"><button class="btn" onclick="backup()">Backup JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">Restaurar Backup</button><button class="primary" onclick="openCarga()">+ Nova Carga</button><button class="ghost" onclick="go('importar')">📥 Importação Inteligente</button><button class="dark" onclick="logout()">Sair</button></div></div>`}
function statusClass(s){return String(s||'Disponível').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('Em transito','Transito')}
function dateBR(d){if(!d)return''; if(d.includes('/'))return d; let [y,m,da]=d.split('-'); return y&&m&&da?`${da}/${m}/${y}`:d}
function today(){return new Date().toISOString().slice(0,10)}
function currency(v){let n=Number(String(v||0).replace(',','.'))||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function nextOp(){let max=Math.max(0,...db.cargas.map(c=>parseInt(c.op)||0),db.lastOp||0); db.lastOp=max+1; return String(db.lastOp).padStart(3,'0')}
function sortedCargas(){return [...db.cargas].sort((a,b)=>(parseInt(b.op)||0)-(parseInt(a.op)||0))}
function normalize(){
  db.cargas.forEach(c=>{
    if(!c.op)c.op=nextOp();
    if(!c.id)c.id=crypto.randomUUID();
    if(!c.data)c.data=today();
    if(c.status==='ativo')c.status='Disponível';
    if(!c.status)c.status='Disponível';
    c.valorEmpresa=Number(c.valorEmpresa ?? c.valor ?? 0);
    c.margem=Number(c.margem ?? 10);
    c.valorMotorista=Number(c.valorMotorista ?? c.valorEmpresa*(1-c.margem/100));
  });
  db.agendamentos.forEach(a=>{if(!a.id)a.id=crypto.randomUUID();});
  db.manifestos.forEach(m=>{
    if(!m.id)m.id=crypto.randomUUID();
    m.agendado=true;
    m.manifestado=!!m.manifestado;
    m.carregado=!!m.carregado;
    m.transito=!!m.transito;
    m.finalizado=!!m.finalizado;
    if(m.finalizado){m.manifestado=true; m.carregado=true; m.transito=true;}
    else if(m.transito){m.manifestado=true; m.carregado=true;}
    else if(m.carregado){m.manifestado=true;}
    let c=db.cargas.find(x=>x.id===m.cargaId);
    // Regra principal: o Manifesto é a fonte da verdade do fluxo operacional.
    // Nunca apagar marcações feitas pelo usuário ao trocar de tela.
    if(c){
      if(m.finalizado)c.status='Finalizado';
      else if(m.transito)c.status='Em trânsito';
      else if(m.carregado)c.status='Carregado';
      else if(m.manifestado)c.status='Manifestado';
      else if(m.agendado)c.status='Agendado';
    }
  });
}
function counts(){let c=db.cargas; return{disp:c.filter(x=>x.status==='Disponível').length,agen:c.filter(x=>x.status==='Agendado').length,mani:c.filter(x=>x.status==='Manifestado').length,fin:c.filter(x=>x.status==='Finalizado').length,pend:pendencias().length}}
function dashboard(m){let ct=counts(); m.innerHTML=topHtml('Dashboard')+`<div class="cards"><div class="card" onclick="search='Disponível';go('cargas')">Disponíveis<b>${ct.disp}</b></div><div class="card" onclick="search='Agendado';go('cargas')">Agendadas<b>${ct.agen}</b></div><div class="card" onclick="search='Manifestado';go('cargas')">Manifestadas<b>${ct.mani}</b></div><div class="card" onclick="search='Finalizado';go('cargas')">Finalizadas<b>${ct.fin}</b></div><div class="card" onclick="go('manifestos')">Pendências<b>${ct.pend}</b></div></div>`+cargasTable(sortedCargas().slice(0,10),'Últimas cargas')}
function cargasPage(m){m.innerHTML=topHtml('Cargas','Cadastro e controle de cargas')+cargasTable(filteredCargas(),'Cargas')}
function filteredCargas(){let q=search.toLowerCase(); return sortedCargas().filter(c=>!q||JSON.stringify(c).toLowerCase().includes(q))}
function cargasTable(rows,title){return `<div class="panel"><div class="toolbar"><h2>${title}</h2><input class="search" placeholder="Buscar..." oninput="search=this.value;render()" value="${search}"></div><table class="table"><thead><tr><th>OP</th><th>Cliente</th><th>Rota</th><th>Produto</th><th>Valores</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.length?rows.map(c=>`<tr onclick="detailsCarga('${c.id}')"><td>${c.op}</td><td>${c.cliente||''}</td><td class="route">${c.origem||''} → ${c.destino||''}</td><td>${c.produto||''}<br><small>${c.quantidade||''}</small></td><td><span class="money">Emp: ${currency(c.valorEmpresa)}</span><span class="money margin">${c.margem}%</span><span class="money">Mot: ${currency(c.valorMotorista)}</span></td><td>${dateBR(c.data)}</td><td><span class="status ${statusClass(c.status)}">${c.status}</span></td><td onclick="event.stopPropagation()"><div class="actionsRow"><button class="green small" onclick="openAg('${c.id}')">Agendar</button><button class="btn small" onclick="openCarga('${c.id}')">Editar</button><button class="btn small" onclick="dupCarga('${c.id}')">Duplicar</button><button class="red small" onclick="delCarga('${c.id}')">Excluir</button></div></td></tr>`).join(''):`<tr><td colspan="8" style="text-align:center;color:#60708a">Nenhuma carga cadastrada</td></tr>`}</tbody></table></div>`}
function openModal(html){document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openCarga(id){let c=id?db.cargas.find(x=>x.id===id):{data:today(),margem:10,status:'Disponível'}; openModal(`<h2>${id?'Editar carga':'Nova carga'}</h2><div class="grid"><div class="field"><label>OP (automática se deixar em branco)</label><input id="op" value="${c.op||''}"></div><div class="field"><label>Cliente</label><input id="cliente" value="${c.cliente||''}"></div><div class="field"><label>Origem</label><input id="origem" value="${c.origem||''}"></div><div class="field"><label>Destino</label><input id="destino" value="${c.destino||''}"></div><div class="field"><label>Produto</label><input id="produto" value="${c.produto||''}"></div><div class="field"><label>Quantidade/Toneladas</label><input id="quantidade" value="${c.quantidade||''}"></div><div class="field"><label>Valor Empresa</label><input id="valorEmpresa" type="number" value="${c.valorEmpresa||''}" oninput="calcMot()"></div><div class="field"><label>Margem (%)</label><input id="margem" type="number" value="${c.margem??10}" oninput="calcMot()"></div><div class="field"><label>Valor Motorista</label><input id="valorMotorista" readonly value="${currency(c.valorMotorista||0)}"></div><div class="field"><label>Data Liberada</label><input id="data" type="date" value="${c.data||today()}"></div><div class="field"><label>Tipo Veículo</label><input id="tipoVeiculo" value="${c.tipoVeiculo||''}"></div><div class="field"><label>Status</label><select id="status">${['Disponível','Agendado','Manifestado','Carregado','Em trânsito','Finalizado'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field span2"><label>Observações</label><textarea id="obs">${c.obs||''}</textarea></div></div><div style="margin-top:14px"><button class="green" onclick="saveCarga('${id||''}')">Salvar</button> <button class="btn" onclick="closeModal()">Fechar</button></div>`); calcMot()}
function calcMot(){let ve=Number(document.getElementById('valorEmpresa')?.value||0), mg=Number(document.getElementById('margem')?.value||0); let el=document.getElementById('valorMotorista'); if(el)el.value=currency(ve*(1-mg/100))}
function saveCarga(id){let c=id?db.cargas.find(x=>x.id===id):{id:crypto.randomUUID(),op:document.getElementById('op').value||nextOp(),createdAt:Date.now()}; Object.assign(c,{op:document.getElementById('op').value||c.op||nextOp(),cliente:cliente.value,origem:origem.value,destino:destino.value,produto:produto.value,quantidade:quantidade.value,valorEmpresa:Number(valorEmpresa.value||0),margem:Number(margem.value||10),valorMotorista:Number(valorEmpresa.value||0)*(1-Number(margem.value||10)/100),data:data.value||today(),tipoVeiculo:tipoVeiculo.value,status:status.value,obs:obs.value}); if(!id)db.cargas.push(c); addHist(c.id,id?'Carga editada':'Carga criada'); closeModal(); render()}
function delCarga(id){if(confirm('Excluir carga?')){db.cargas=db.cargas.filter(c=>c.id!==id);db.agendamentos=db.agendamentos.filter(a=>a.cargaId!==id);render()}}
function dupCarga(id){let c=db.cargas.find(x=>x.id===id); if(!c)return; let n=Object.assign({},c,{id:crypto.randomUUID(),op:nextOp(),createdAt:Date.now(),status:'Disponível'}); db.cargas.push(n); addHist(n.id,'Carga duplicada da OP '+c.op); render();}
function detailsCarga(id){let c=db.cargas.find(x=>x.id===id); let ag=db.agendamentos.find(a=>a.cargaId===id); let hist=db.historico.filter(h=>h.cargaId===id); openModal(`<h2>Detalhes da carga</h2><div class="grid">${[['OP',c.op],['Cliente',c.cliente],['Origem',c.origem],['Destino',c.destino],['Produto',c.produto],['Quantidade',c.quantidade],['Valor Empresa',currency(c.valorEmpresa)],['Margem',c.margem+'%'],['Valor Motorista',currency(c.valorMotorista)],['Data Liberada',dateBR(c.data)],['Tipo Veículo',c.tipoVeiculo||''],['Status',c.status]].map(x=>`<div class="readonly"><small>${x[0]}</small><b>${x[1]||'-'}</b></div>`).join('')}<div class="readonly span2"><small>Agendamento</small><b>${ag?`${ag.motorista} - ${ag.placa} - ${ag.telefone}`:'Sem agendamento'}</b></div><div class="readonly span2"><small>Histórico</small>${hist.length?hist.map(h=>`<div>${dateBR(h.data)} ${h.hora} - ${h.txt}</div>`).join(''):'Sem histórico'}</div></div><div style="margin-top:14px"><button class="btn" onclick="closeModal()">Fechar</button> <button class="primary" onclick="closeModal();openCarga('${id}')">Editar</button> <button class="green" onclick="closeModal();openAg('${id}')">Agendar</button></div>`)}
function openAg(id){let c=db.cargas.find(x=>x.id===id); let motors=db.motoristas||[]; openModal(`<h2>Agendar carga</h2><p><b>${c.op} - ${c.origem} x ${c.destino}</b></p><div class="grid"><div class="field"><label>Motorista cadastrado</label><select id="motorSel" onchange="fillMotor()"><option value="">Selecionar...</option>${motors.map(m=>`<option value="${m.id}">${m.nome||m.placa}</option>`).join('')}</select></div><div class="field"><label>Motorista</label><input id="mot" value=""></div><div class="field"><label>Placa</label><input id="placa" value=""></div><div class="field"><label>Telefone</label><input id="tel" value=""></div><div class="field"><label>Data</label><input id="dtAg" type="date" value="${today()}"></div><div class="field span2"><label>Observações</label><textarea id="obsAg"></textarea></div></div><div style="margin-top:14px"><button class="green" onclick="saveAg('${id}')">Salvar</button> <button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function fillMotor(){let m=db.motoristas.find(x=>x.id===motorSel.value); if(m){mot.value=m.nome||'';placa.value=m.placa||'';tel.value=m.telefone||''}}

function saveManifesto(id){
  let f=db.manifestos.find(x=>x.id===id); if(!f)return;
  const get=k=>!!document.getElementById(`mf_${id}_${k}`)?.checked;
  let novo={manifestado:get('manifestado'),carregado:get('carregado'),transito:get('transito'),finalizado:get('finalizado')};
  if(novo.finalizado && !novo.transito){alert('Para finalizar, marque primeiro Em trânsito.'); return;}
  if(novo.transito && !novo.carregado){alert('Para marcar Em trânsito, marque primeiro Carregado.'); return;}
  if(novo.carregado && !novo.manifestado){alert('Para marcar Carregado, marque primeiro Manifestado.'); return;}
  if(!novo.manifestado){novo.carregado=false; novo.transito=false; novo.finalizado=false;}
  if(!novo.carregado){novo.transito=false; novo.finalizado=false;}
  if(!novo.transito){novo.finalizado=false;}
  f.agendado=true; f.manifestado=novo.manifestado; f.carregado=novo.carregado; f.transito=novo.transito; f.finalizado=novo.finalizado;
  let c=db.cargas.find(x=>x.id===f.cargaId);
  if(c){
    if(f.finalizado)c.status='Finalizado';
    else if(f.transito)c.status='Em trânsito';
    else if(f.carregado)c.status='Carregado';
    else if(f.manifestado)c.status='Manifestado';
    else c.status='Agendado';
    addHist(c.id,'Manifesto salvo: '+c.status);
  }
  normalize(); save(); alert('Manifesto salvo.'); render();
}

let impList=[];
function impSetStatus(t){let e=document.getElementById('impStatus'); if(e)e.textContent=t}
function normalizeTextBasic(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();}
function cleanOCR(s){
  return String(s||'')
    .replace(/\r/g,'\n')
    .replace(/[|]+/g,'\n')
    .replace(/—|–/g,' → ')
    .replace(/\bCOTR1SAL\b/gi,'COTRISAL')
    .replace(/\bAGROFELAUGUSTO\b/gi,'AGROFEL AUGUSTO')
    .replace(/AGROFEL([A-ZÁÉÍÓÚÃÕÇ])/g,'AGROFEL $1')
    .replace(/COTRISAL([A-ZÁÉÍÓÚÃÕÇ])/g,'COTRISAL $1')
    .replace(/OLEOPLAN([A-ZÁÉÍÓÚÃÕÇ])/g,'OLEOPLAN $1')
    .replace(/BOCCHI([A-ZÁÉÍÓÚÃÕÇ])/g,'BOCCHI $1')
    .replace(/SOJA\s*A?\s*GRANEL|SOJAAGRANEL/gi,'SOJA A GRANEL')
    .replace(/SOJA\s*BENEFICIADA/gi,'SOJA BENEFICIADA')
    .replace(/FARELO\s*DE\s*SOJA|FARELEDESOJA|FARELODESOJA/gi,'FARELO DE SOJA')
    .replace(/PORTO\s*RIO\s*GRANDE|PORTORIOGRANDE/gi,'PORTO RIO GRANDE')
    .replace(/RIOGRANDE/gi,'RIO GRANDE')
    .replace(/CAPA[OD]O\s*DO\s*LEAO|CAPADDOLEAO|CAPAO\s*DO\s*LEAO/gi,'CAPAO DO LEAO')
    .replace(/STO\.?\s*EXPEDITO/gi,'STO. EXPEDITO')
    .replace(/\s+/g,' ')
    .trim();
}
function titleCaseFrete(s){return String(s||'').replace(/\s+/g,' ').trim().toUpperCase();}
function numBR(v){let s=String(v||'').replace(/[^0-9,\.]/g,''); if(!s)return 0; if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(','))s=s.replace(',','.'); return Number(s)||0}
function extractProduct(t){let m=String(t||'').match(/\b(SOJA\s+A\s+GRANEL|SOJA\s+BENEFICIADA(?:\s*-?\s*FIXO)?|FARELO\s+DE\s+SOJA(?:\s+PRO\s*45,?5\s*MI?)?|FARELO|MILHO|TRIGO|ARROZ|DDG|UREIA|FERTILIZANTE|CALC[ÁA]RIO)\b/i); return m?titleCaseFrete(m[1].replace(/\s*-\s*FIXO/i,' - FIXO')):''}
function extractVehicle(t){let m=String(t||'').match(/\b(SOMENTE\s+)?(\d+\s*EIXOS?|LS|BITREM|RODOTREM|TRUCK|GRANELEIRO|BASCULANTE|CA[CÇ]AMBA)\b/i); return m?titleCaseFrete(m[0].replace(/^SOMENTE\s+/i,'')):''}
function extractValue(t){let m=String(t||'').match(/R\$\s*([0-9.]+,?\d{0,2})/i) || String(t||'').match(/\b([0-9]{2,4},\d{2})\b/); return m?numBR(m[1]):0}
function findKnownCompany(t){let raw=normalizeTextBasic(t); let known=['AGROFEL','COTRISAL','CARGILL','BUNGE','LDC','OLEOPLAN','COFCO','BOCCHI','BIANCHINI','MOINHO NORDESTE','CAMIL','ADM','GRANJA PINHEIROS']; return known.find(k=>raw.includes(k))||'';}
function validRoutePart(s){s=cleanOCR(s); return s && !/^(RODO|BR|CN|MODAL|DATA|COTA|OP|PRODUTO|FRETE|TURNO|AS|DISP|USO)$/i.test(s);}
function splitRouteWhats(line){
  let routeLine=cleanOCR(line).replace(/\s+X\s+/i,' x ');
  let parts=routeLine.split(/\s+x\s+|\s*→\s*/i);
  if(parts.length<2)parts=routeLine.split(/\s+-\s+(?=[A-ZÁÉÍÓÚÃÕÇ].*\/RS|[A-ZÁÉÍÓÚÃÕÇ].*\/PR|[A-ZÁÉÍÓÚÃÕÇ].*\/SC)/i);
  if(parts.length>=2)return [cleanOCR(parts[0]), cleanOCR(parts.slice(1).join(' '))];
  return ['',''];
}
function parseWhatsapp(t){
  let raw=cleanOCR(t), lines=String(t||'').split(/\n+/).map(x=>cleanOCR(x)).filter(Boolean);
  let value=extractValue(raw), product=extractProduct(raw), vehicle=extractVehicle(raw);
  let routeLine=lines.find(l=>/(\/RS|\/PR|\/SC|\/SP|\/GO|\/MT|\/MS).*(\sx\s|→|\s-\s).*(\/RS|\/PR|\/SC|\/SP|\/GO|\/MT|\/MS)/i.test(l)) || lines.find(l=>/\sx\s|→/.test(l)) || raw;
  let [origem,destino]=splitRouteWhats(routeLine);
  if(!origem||!destino){
    let pin=lines.findIndex(l=>/📍|ORIGEM/i.test(l));
    let flag=lines.findIndex(l=>/🏁|DESTINO/i.test(l));
    if(pin>=0)origem=cleanOCR(lines[pin].replace(/📍|ORIGEM:?/ig,''));
    if(flag>=0)destino=cleanOCR(lines[flag].replace(/🏁|DESTINO:?/ig,''));
  }
  let cliente=findKnownCompany(raw);
  return {cliente,origem,destino,produto:product,quantidade:'',valorEmpresa:value,margem:Number(document.getElementById('impMarg')?.value||10),valorMotorista:value*(1-Number(document.getElementById('impMarg')?.value||10)/100),data:today(),tipoVeiculo:vehicle,status:'Disponível',obs:''};
}
function tableSegments(t){
  let raw=String(t||'').replace(/\r/g,'\n');
  let byLine=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let rows=byLine.filter(l=>/\bRODO\b/i.test(l)&&/\b(SOJA|FARELO|MILHO|TRIGO|ARROZ)\b/i.test(l));
  if(rows.length>=2)return rows;
  let compact=raw.replace(/\n/g,' ').replace(/\s+/g,' ');
  let parts=compact.split(/(?=\b(?:aa\s+|\d+\s+|BR\s+)?RODO\s+\d{3,6}\b)/i).map(x=>x.trim()).filter(x=>/\bRODO\s+\d{3,6}\b/i.test(x));
  return parts;
}
function splitColumnsPreserve(seg){
  let line=String(seg||'').replace(/\t/g,'    ').replace(/\r/g,' ').trim();
  let cols=line.split(/\s{2,}/).map(cleanOCR).filter(Boolean);
  if(cols.length>=8)return cols;
  return [];
}
function parseTableByColumns(seg){
  let cols=splitColumnsPreserve(seg); if(!cols.length)return null;
  let idx=cols.findIndex(c=>/^RODO$/i.test(c)||/RODO\s+\d/i.test(c));
  let cnIdx=cols.findIndex(c=>/^\d{3,6}(\s*\(?\d+\)?)?$/.test(c));
  let start = idx>=0 ? idx+2 : (cnIdx>=0?cnIdx+1:0);
  // Remove colunas iniciais de ícones/data/modal/cn quando existirem
  let fields=cols.slice(start);
  if(fields.length<5)return null;
  let productIndex=fields.findIndex(f=>extractProduct(f));
  if(productIndex<4)return null;
  let value=0;
  let valCol=fields[productIndex+1]||'';
  if(/\b\d{2,4}\b/.test(valCol))value=Number((valCol.match(/\b(\d{2,4})\b/)||[])[1])||0;
  return buildCarga(fields[0], fields[2], fields[3], extractProduct(fields[productIndex]), value, '');
}
function buildCarga(cliente,origem,destino,produto,valor,veiculo){
  let mg=Number(document.getElementById('impMarg')?.value||10), ve=Number(valor||0);
  return {cliente:titleCaseFrete(cliente),origem:titleCaseFrete(origem),destino:titleCaseFrete(destino),produto:titleCaseFrete(produto),quantidade:'',valorEmpresa:ve,margem:mg,valorMotorista:ve*(1-mg/100),data:today(),tipoVeiculo:titleCaseFrete(veiculo||''),status:'Disponível',obs:''};
}
function tokenizePlaces(s){
  s=cleanOCR(s);
  const prefixes=['AGROFEL','BOCCHI','COTRISAL','ILTON SCHIO BALZAN','GRANJA PINHEIROS-GRAO PARA','GRANJA PINHEIROS','JONATAN CEREZER BULIGON','MAURICIO SILVEIRA COSTA','TRES TENTOS-VACARIA','JOCELITO BOEIRA RODRIGUES','RIO PARDO - GRANELEIRA','PORTO RIO GRANDE - RS','PORTO RIO GRANDE','BIANCHINI-RIO GRANDE','CAPAO DO LEAO'];
  let found=[];
  for(const p of prefixes){let re=new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m; while((m=re.exec(s)))found.push({p:cleanOCR(m[0]),i:m.index});}
  found.sort((a,b)=>a.i-b.i);
  // cria blocos iniciando em prefixos conhecidos
  let blocks=[];
  for(let i=0;i<found.length;i++){
    let a=found[i], b=found[i+1];
    let txt=s.slice(a.i,b?b.i:undefined).trim();
    if(txt && !blocks.includes(txt))blocks.push(txt);
  }
  return blocks.map(cleanOCR).filter(validRoutePart);
}
function parseTableLine(seg){
  let byCols=parseTableByColumns(seg); if(byCols && isStrongUseful(byCols))return byCols;
  let s=cleanOCR(seg);
  let product=extractProduct(s);
  let value=0;
  if(product){
    let pEsc=product.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    let m=s.match(new RegExp(pEsc+'\\s+(?:PRO\\s*45,?5\\s*MI\\s*)?(\\d{2,4})\\b','i'));
    if(m)value=Number(m[1])||0;
  }
  if(!value){let nums=[...s.matchAll(/\b(\d{2,4})(?=\s*(?:07:|08:|19:|AS|$))/gi)].map(m=>Number(m[1])).filter(n=>n>=20&&n<=999); if(nums.length)value=nums[0];}
  let beforeProduct=product?s.split(new RegExp(product.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'),'i'))[0]:s;
  let afterRodo=(beforeProduct.match(/\bRODO\s+\d{3,6}\s*(?:\(?\s*\d{4,6}\s*\)?)?\s+(.+)/i)||[])[1]||beforeProduct;
  afterRodo=afterRodo.replace(/^\d{1,2}\s+/,'').replace(/^BR\s+/i,'');
  let blocks=tokenizePlaces(afterRodo);
  let cliente='', origem='', destino='';
  if(blocks.length>=4){cliente=blocks[0]; origem=blocks[blocks.length-2]; destino=blocks[blocks.length-1];}
  else if(blocks.length===3){cliente=blocks[0]; origem=blocks[1]; destino=blocks[2];}
  else if(blocks.length===2){origem=blocks[0]; destino=blocks[1]; cliente=findKnownCompany(s);}
  else {cliente=findKnownCompany(s);}
  // destinos comuns no fim do registro
  let destMatch=s.match(/\b(PORTO RIO GRANDE\s*-\s*RS|BIANCHINI\s*-?\s*RIO GRANDE|GRANJA PINHEIROS\s*-?\s*GRAO PARA|AGROFEL\s+CAPAO DO LEAO|BOCCHI\s*-?\s*MUITOS CAPOES)\b/i);
  if(destMatch)destino=cleanOCR(destMatch[1]);
  if(!origem && blocks.length>=2)origem=blocks[blocks.length-2];
  return buildCarga(cliente,origem,destino,product,value,'');
}
function isStrongUseful(c){return !!((c.origem&&c.destino) || (c.produto&&c.valorEmpresa) || (c.cliente&&c.produto&&c.destino));}
function isUseful(c){return isStrongUseful(c) || !!(c.origem||c.destino||c.produto||c.valorEmpresa||c.cliente)}
function parseImportAll(t){
  let text=String(t||'');
  let segs=tableSegments(text);
  let out=[];
  if(segs.length>=2 || (segs.length===1 && /\bRODO\b/i.test(text))){
    out=segs.map(parseTableLine).filter(isStrongUseful);
  } else {
    out=[parseWhatsapp(text)].filter(isUseful);
  }
  if(!out.length && text.trim())out=[parseWhatsapp(text)].filter(isUseful);
  return out;
}

  </div></div>`).join('');
}

function imageToCanvas(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=img.naturalWidth||img.width;
      canvas.height=img.naturalHeight||img.height;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0);
      resolve({img,canvas,ctx,width:canvas.width,height:canvas.height});
    };
    img.onerror=reject;
    const reader=new FileReader();
    reader.onload=()=>{img.src=reader.result;};
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function detectBlueBandsFromCanvas(ctx,width,height){
  // Detecta as linhas azuis da coluna Data dos VLogs. Isso evita importar linhas vermelhas.
  // Não depende do texto: olha a cor de fundo azul/ciano da linha.
  const data=ctx.getImageData(0,0,width,height).data;
  let rows=[];
  for(let y=0;y<height;y++){
    let count=0;
    for(let x=0;x<Math.min(width,220);x++){
      const i=(y*width+x)*4, r=data[i], g=data[i+1], b=data[i+2];
      // Azul/ciano dos VLogs, tolerante a compressão e zoom.
      if(b>120 && g>110 && r<90 && (b-r)>60 && (g-r)>50) count++;
    }
    if(count>18) rows.push(y);
  }
  if(!rows.length){
    // às vezes a coluna Data fica um pouco mais para a direita conforme o recorte
    for(let y=0;y<height;y++){
      let count=0;
      for(let x=0;x<Math.min(width,320);x++){
        const i=(y*width+x)*4, r=data[i], g=data[i+1], b=data[i+2];
        if(b>120 && g>110 && r<100 && (b-r)>45 && (g-r)>35) count++;
      }
      if(count>18) rows.push(y);
    }
  }
  if(!rows.length)return [];
  let bands=[], start=rows[0], last=rows[0];
  for(let i=1;i<rows.length;i++){
    if(rows[i]-last>2){bands.push([start,last]); start=rows[i];}
    last=rows[i];
  }
  bands.push([start,last]);
  // transforma o retângulo do chip azul numa faixa inteira da linha
  return bands
    .filter(b=>b[1]-b[0]>=6)
    .map(b=>{
      const mid=(b[0]+b[1])/2;
      return {y0:Math.max(0,mid-12), y1:Math.min(height,mid+18), mid};
    });
}
function wordsFromTesseract(ret){
  const words=(ret && ret.data && ret.data.words) || [];
  return words.map(w=>{
    const bbox=w.bbox||{};
    return {text:String(w.text||'').trim(), x0:bbox.x0??w.x0??0, y0:bbox.y0??w.y0??0, x1:bbox.x1??w.x1??0, y1:bbox.y1??w.y1??0};
  }).filter(w=>w.text && w.text.length>0);
}
function joinWords(ws){return ws.sort((a,b)=>a.x0-b.x0).map(w=>w.text).join(' ').replace(/\s+/g,' ').trim();}
function wordsInBand(words,band){return words.filter(w=>((w.y0+w.y1)/2)>=band.y0 && ((w.y0+w.y1)/2)<=band.y1);}
function parseBlueRowsByPosition(words,bands,width){
  if(!bands || !bands.length || !words || !words.length) return [];
  const mg=Number(document.getElementById('impMarg')?.value||10);
  let cargas=[];
  for(const band of bands){
    let row=wordsInBand(words,band);
    // remove cabeçalho/botão, mantém palavras úteis
    row=row.filter(w=>!/^Cota|Op\.?|Data|Modal|CN|Cliente|Tomador|Origem|Destino|Produto|Frete|Turno|A[cç][aã]o$/i.test(w.text));
    if(row.length<5) continue;
    const byX=(a,b)=>a.x0-b.x0;
    const col=(a,b)=>joinWords(row.filter(w=>w.x0>=a*width && w.x0<b*width).sort(byX));
    // posições aproximadas do layout VLog, proporcionais ao print
    let cliente=cleanOCR(col(0.205,0.355));
    let tomador=cleanOCR(col(0.355,0.500));
    let origem=cleanOCR(col(0.500,0.635));
    let destino=cleanOCR(col(0.635,0.785));
    let produto=cleanOCR(col(0.785,0.930));
    let freteTxt=cleanOCR(col(0.920,0.995));
    // fallback para recortes com colunas deslocadas
    if(!extractProduct(produto)){
      produto=cleanOCR(col(0.760,0.930));
      freteTxt=cleanOCR(col(0.900,0.995));
    }
    let produtoFinal=extractProduct(produto)||extractProduct(joinWords(row));
    let freteMatch=freteTxt.match(/\b(\d{2,4})(?:[,.]\d{1,2})?\b/);
    let valor=freteMatch?numBR(freteMatch[1]):0;
    if(!valor){
      // pega o último número plausível da linha, evitando data, modal e CN
      const nums=row.filter(w=>w.x0>0.88*width).map(w=>w.text).join(' ').match(/\b\d{2,4}\b/g)||[];
      valor=nums.length?Number(nums[0]):0;
    }
    // Limpeza de "BOCCHI-" e OCR grudado
    cliente=cliente.replace(/\s*-\s*$/,'').trim();
    origem=origem.replace(/\s*-\s*$/,'').trim();
    destino=destino.replace(/\s*-\s*$/,'').trim();
    const c=buildCarga(cliente||findKnownCompany(joinWords(row)), origem, destino, produtoFinal, valor, '');
    if((c.origem||c.destino||c.cliente) && c.produto && c.valorEmpresa){
      c.obs='Criada por Importação Inteligente - linha azul';
      cargas.push(c);
    }
  }
  return cargas;
}
function renderPreviewFromList(list,statusMsg){
  impList=list||[];
  let prev=document.getElementById('prev'); if(!prev)return;
  if(!impList.length){prev.innerHTML='<div class="notice span2">Nenhuma carga encontrada. Você pode ajustar o texto lido acima e clicar em Analisar.</div>'; impSetStatus('Nenhuma carga válida encontrada.'); return;}
  impSetStatus(statusMsg || `${impList.length} carga(s) encontrada(s). Confira antes de salvar.`);
  prev.innerHTML=impList.map((c,i)=>`<div class="panel span2" style="box-shadow:none;margin:0"><label style="font-weight:900"><input type="checkbox" id="imp_sel_${i}" checked> Criar carga ${i+1}</label><div class="grid" style="margin-top:10px">
    ${impField(i,'cliente','Cliente',c.cliente)}${impField(i,'origem','Origem',c.origem)}${impField(i,'destino','Destino',c.destino)}${impField(i,'produto','Produto',c.produto)}
    ${impField(i,'quantidade','Quantidade',c.quantidade)}${impField(i,'valorEmpresa','Valor Empresa',c.valorEmpresa,'number')}${impField(i,'margem','Margem (%)',c.margem,'number')}${impField(i,'valorMotorista','Valor Motorista',c.valorMotorista,'number')}${impField(i,'tipoVeiculo','Tipo veículo',c.tipoVeiculo)}${impField(i,'data','Data',c.data,'date')}
  </div></div>`).join('');
}

async function showImg(file){
  let r=new FileReader();
  r.onload=async()=>{
    drop.innerHTML=`<img src="${r.result}"><p>Imagem recebida. Fazendo OCR por posição...</p>`;
    if(window.Tesseract){
      try{
        impSetStatus('Lendo imagem e detectando linhas azuis...');
        const canvasObj=await imageToCanvas(file);
        const blueBands=detectBlueBandsFromCanvas(canvasObj.ctx,canvasObj.width,canvasObj.height);
        const ret=await Tesseract.recognize(file,'por+eng');
        document.getElementById('impText').value=(ret.data&&ret.data.text)||'';
        const words=wordsFromTesseract(ret);
        const posCargas=parseBlueRowsByPosition(words,blueBands,canvasObj.width);
        if(posCargas.length){
          renderPreviewFromList(posCargas,`${posCargas.length} linha(s) azul(is) encontrada(s). Confira antes de salvar.`);
        }else{
          // fallback antigo por texto
          previewImport();
          if(blueBands.length && (!impList || !impList.length)) impSetStatus('Detectei linha azul, mas o OCR não separou as colunas. Tente um print com mais zoom ou recorte mais próximo da tabela.');
        }
      }catch(e){
        console.error(e);
        impSetStatus('Não consegui ler a imagem. Cole o texto manualmente.');
      }
    }else{
      impSetStatus('OCR indisponível. Cole o texto manualmente.');
    }
  };
  r.readAsDataURL(file);
}
function fileImg(e){if(e.target.files[0])showImg(e.target.files[0])}
